#
# buf module config for the single-source-of-truth proto tree.
# Files are flat at the root (common.proto, user.proto, health.proto, ...) by
# design, each with its own package. That layout intentionally conflicts with two
# STANDARD rules that assume the `dir == package` convention, so both are relaxed;
# every other STANDARD rule stays on to keep the contract disciplined.
version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # Files need not live in a directory matching their package (we keep them flat).
    - PACKAGE_DIRECTORY_MATCH
    # A single flat directory holds multiple packages by design.
    - DIRECTORY_SAME_PACKAGE
breaking:
  use:
    - FILE

// Authentication responses for the session-cookie auth flow.

syntax = "proto3";

package elysium.auth.v1;

// The authenticated principal behind the session cookie.
//
// This is what `/api/v1/me` returns once the `SessionUser` extractor has
// resolved the session. The SPA also uses it as its session probe.
message MeResponse {
  string subject = 1; // Stable opaque user identifier.
  string email = 2; // May be empty for non-interactive principals.
  string username = 3; // Display username, if present.
}

//
// The server-to-client realtime channel (SSE). One discriminated envelope carries
// every server-push type over a single connection; the `kind` is mirrored as the
// SSE `event:` name so a client can route before decoding, and `sequence` is the
// SSE `id:` for Last-Event-ID resume. See docs/realtime.md.

syntax = "proto3";

package elysium.realtime.v1;

import "common.proto";
import "user.proto";

// Discriminator for the envelope, mirrored as the SSE `event:` name.
enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  // A full state dump on connect / resync. Payload is minimal for now.
  EVENT_KIND_SNAPSHOT = 1;
  EVENT_KIND_ORG_UPDATED = 2;
  EVENT_KIND_PROFILE_UPDATED = 3;
  EVENT_KIND_PRESENCE_CHANGED = 4;
  // A change to the session's accounts (signed out elsewhere, account added, ...);
  // the client re-fetches `/session/accounts` and `/me`.
  EVENT_KIND_SESSION_CHANGED = 5;
}

// An org's mutable, broadcastable fields changed.
message OrgUpdated {
  elysium.common.v1.Uuid id = 1;
  string name = 2;
  string logo_url = 3;
}

// A profile changed (name, avatar, bio, or status). Carries the full profile so
// receivers can replace their copy without a follow-up fetch.
message ProfileUpdated {
  elysium.user.v1.User user = 1;
}

// A user's derived presence changed (came online / went offline / idle).
message PresenceChanged {
  elysium.common.v1.Uuid user_id = 1;
  elysium.user.v1.Presence presence = 2;
}

// A nudge to re-read session state; `reason` is advisory (for logs / UX).
message SessionChanged {
  string reason = 1;
}

// Reserved for the on-connect full-state snapshot; empty until state sync lands.
message Snapshot {}

// The one message every SSE frame carries, base64-encoded into `data:`.
message EventEnvelope {
  // Monotonic per-user id; echoed as the SSE `id:` line for Last-Event-ID resume.
  uint64 sequence = 1;
  elysium.common.v1.Timestamp emitted_at = 2;
  EventKind kind = 3;

  // Exactly one payload. Field numbers stay stable as kinds are added.
  oneof payload {
    Snapshot snapshot = 10;
    OrgUpdated org_updated = 11;
    ProfileUpdated profile_updated = 12;
    PresenceChanged presence_changed = 13;
    SessionChanged session_changed = 14;
  }
}

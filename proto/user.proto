// Copyright © 2026 Jalapeno Labs
//
// Identity domain: the application's view of users, organizations, and teams.
//
// The API owns credentials and authentication (see docs/auth-model.md); these
// messages describe the profile and membership data, keyed by the stable `subject`.

syntax = "proto3";

package elysium.user.v1;

import "common.proto";

// Derived presence: computed from live connections and activity, never a stored
// user choice. Online means at least one live session; away is connected-but-idle;
// offline is no live connection (render "last seen" from `last_seen_at`).
enum Presence {
  PRESENCE_UNSPECIFIED = 0;
  PRESENCE_ONLINE = 1;
  PRESENCE_AWAY = 2;
  PRESENCE_OFFLINE = 3;
}

// A user-declared status that overrides derived presence while it is in effect.
// The zero value means no override (fall back to `presence`).
enum ManualStatusKind {
  MANUAL_STATUS_KIND_UNSPECIFIED = 0;
  MANUAL_STATUS_KIND_OUT_OF_OFFICE = 1;
  MANUAL_STATUS_KIND_DO_NOT_DISTURB = 2;
  // A free-text status (`manual_status_text` carries the label).
  MANUAL_STATUS_KIND_CUSTOM = 3;
}

// The user's preferred UI language. UNSPECIFIED is auto-detect from the client, the
// default. Extended as translations ship; a value with no shipped translation falls
// back to auto-detect at render time.
enum Language {
  LANGUAGE_UNSPECIFIED = 0;
  LANGUAGE_EN_US = 1;
}

// A member of an organization and their Elysium-owned profile.
message User {
  elysium.common.v1.Uuid id = 1;

  // Stable opaque identifier for the user (the token/session subject).
  string subject = 2;

  string email = 3;

  // The person's name. `given_name`/`family_name` are the full name (both
  // optional; not everyone has both, and order varies by culture); `display_name`
  // is what the UI renders everywhere and defaults to `given_name` when blank.
  // Never concatenate given + family for display; use `display_name`.
  string given_name = 11;
  string family_name = 12;
  string display_name = 4;

  string avatar_url = 5;
  string bio = 6;

  // Derived, read-only. Computed server-side; ignored on writes.
  Presence presence = 7;

  // The active manual override, if any. `manual_status` is the zero value when
  // none is set or the override has expired. `manual_status_expires_at` is when
  // it lapses back to derived presence.
  ManualStatusKind manual_status = 13;
  string manual_status_text = 14;
  elysium.common.v1.Timestamp manual_status_expires_at = 15;

  // Last time the user was seen active; used to render "last seen" presence.
  elysium.common.v1.Timestamp last_seen_at = 8;

  elysium.common.v1.Timestamp created_at = 9;
  elysium.common.v1.Timestamp updated_at = 10;

  // Contact and personalization fields (account settings). All optional; empty
  // means unset. `language` is auto-detect when LANGUAGE_UNSPECIFIED.
  string pronouns = 16;
  string web_link = 17;
  string contact_phone = 18;
  string backup_email = 19;
  Language language = 20;

  // Preferred display timezone as an IANA name, e.g. "America/Denver". Empty is
  // auto-detect, the default, leaving the client to use its own guessed zone.
  // Display-only: it never changes a stored instant, which is always UTC.
  string timezone = 21;
}

// Editable profile fields. Presence and manual status are set elsewhere; this is
// the "who you are" surface (the onboarding profile step and account settings).
message UpdateProfileRequest {
  string given_name = 1;
  string family_name = 2;
  // When blank, the server falls back to `given_name`.
  string display_name = 3;
  string bio = 4;
  // Profile picture URL (external, or a storage path once the storage service
  // lands). Optional for a partial update: omitted leaves the avatar unchanged,
  // an empty string clears it.
  optional string avatar_url = 5;

  // Contact and personalization fields. Sent whole (empty clears); `language`
  // of LANGUAGE_UNSPECIFIED means auto-detect.
  string pronouns = 6;
  string web_link = 7;
  string contact_phone = 8;
  string backup_email = 9;
  Language language = 10;

  // IANA timezone name; empty means auto-detect. Validated against the tz
  // database on write: an unknown zone stores as empty rather than rejecting
  // the whole update.
  string timezone = 11;
}

// Sets or clears the manual status override. `kind` = UNSPECIFIED clears it.
// `text` labels a CUSTOM status; `duration_seconds` sets the expiry (0 uses the
// default 24h), after which presence reverts to automatic.
message SetStatusRequest {
  ManualStatusKind kind = 1;
  string text = 2;
  int64 duration_seconds = 3;
}

// A top-level tenant. Every team and user belongs to exactly one organization.
message Org {
  elysium.common.v1.Uuid id = 1;
  string name = 2;

  // URL-safe unique handle within the deployment, e.g. "jalapeno-labs".
  string slug = 3;

  elysium.common.v1.Timestamp created_at = 4;
}

// A group within an organization (admins, dev, qa, contractors, interns, ...).
message Team {
  elysium.common.v1.Uuid id = 1;
  elysium.common.v1.Uuid org_id = 2;
  string name = 3;

  // URL-safe unique handle within the organization, e.g. "dev".
  string slug = 4;

  elysium.common.v1.Timestamp created_at = 5;
}

// A user's role within a single team. Permissions derive from (user, team, role).
enum TeamRole {
  TEAM_ROLE_UNSPECIFIED = 0;
  TEAM_ROLE_MEMBER = 1;
  TEAM_ROLE_ADMIN = 2;
  TEAM_ROLE_OWNER = 3;
}

// Membership edge linking a user to a team with a role.
message TeamMembership {
  elysium.common.v1.Uuid user_id = 1;
  elysium.common.v1.Uuid team_id = 2;
  TeamRole role = 3;
  elysium.common.v1.Timestamp joined_at = 4;
}

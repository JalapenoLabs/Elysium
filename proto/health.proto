//
// Greeting and database-reachability responses for the versioned API.
//
// Liveness (`GET /`) and server health (`GET /health`) are plain infra endpoints
// (text and JSON) for load balancers and uptime monitors, so they are not part of
// this typed contract. Only the versioned `/api/v1/*` routes are protobuf.

syntax = "proto3";

package elysium.health.v1;

// A friendly greeting, handy for confirming the frontend reached the API.
message HelloResponse {
  string message = 1;
}

// Result of probing Postgres connectivity through the pool.
message DatabaseHealthResponse {
  bool reachable = 1;

  // Present only when `reachable` is false; the underlying error, for display.
  string error = 2;
}

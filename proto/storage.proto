//
// Storage domain: the Drive gateway over many providers.
//
// Storage is a gateway, not a sync engine and not a filesystem re-implementation.
// An org owns many project-scoped Drives, each one OpenDAL operator rooted where
// the org points it; the provider is always the source of truth. This file is the
// metadata/control contract only. Raw file bytes travel as octet streams, never as
// protobuf. See docs/storage.md for the model these messages encode.

syntax = "proto3";

package elysium.storage.v1;

import "common.proto";

// The provider a Drive is backed by. Determines the OpenDAL service and which
// capabilities the Drive can advertise. Immutable for the life of a Drive.
enum DriveKind {
  DRIVE_KIND_UNSPECIFIED = 0;
  // A directory on the host's local filesystem.
  DRIVE_KIND_FS = 1;
  // Any S3-compatible bucket (AWS, GCS, MinIO, Wasabi, B2, Bunny).
  DRIVE_KIND_S3 = 2;
  // A path on a remote machine reached over SSH.
  DRIVE_KIND_SFTP = 3;
}

// Who inside the org may see and use a Drive. The org boundary is absolute:
// outsiders never have access. Admins and up always have access, enforced in the
// authz check and never stored.
enum DriveVisibility {
  DRIVE_VISIBILITY_UNSPECIFIED = 0;
  // Every member of the org can see and use the Drive.
  DRIVE_VISIBILITY_ORG_WIDE = 1;
  // Access granted to a chosen mix of teams and users via DriveAccess grants.
  DRIVE_VISIBILITY_RESTRICTED = 2;
}

// A capability a provider advertises and a consumer requires. A storage binding is
// legal only when the provider satisfies the consumer role's required capability.
enum StorageCapability {
  STORAGE_CAPABILITY_UNSPECIFIED = 0;
  // List/read/write/delete files at paths. Every provider has it.
  STORAGE_CAPABILITY_PLAIN_FILES = 1;
  // Content-addressed blob put/get/stat with strong read-after-write and
  // multipart uploads. Local FS and S3 only.
  STORAGE_CAPABILITY_OBJECT_STORE = 2;
  // A real local filesystem (locking, rename, mmap, atomic ref updates). Local FS
  // only; git object stores and Astraval metadata physically require it.
  STORAGE_CAPABILITY_POSIX_FS = 3;
}

// Non-secret connection settings for a Drive, one group per kind.
//
// This carries only fields safe to return to the client. Provider secrets (S3
// keys, SFTP password or PEM) are never modeled here; they are sealed server-side
// and surfaced only as Drive.credential_set.
message DriveConfig {
  // Local filesystem settings.
  message Fs {
    // Absolute host path the operator is rooted at.
    string root = 1;
  }

  // S3-compatible bucket settings.
  message S3 {
    // Endpoint URL; empty uses the provider default for the region.
    string endpoint = 1;
    // Region, e.g. "us-east-1".
    string region = 2;
    // Bucket name.
    string bucket = 3;
    // Key prefix the Drive is rooted at; empty roots at the bucket root.
    string prefix = 4;
    // Request server-side encryption (SSE). Non-secret provider setting.
    bool sse = 5;
  }

  // SFTP-over-SSH settings.
  message Sftp {
    // Remote host name or address.
    string host = 1;
    // TCP port; conventionally 22.
    uint32 port = 2;
    // SSH user name.
    string user = 3;
    // Remote path the operator is rooted at.
    string base_path = 4;
  }

  // The active settings group, keyed by the Drive's kind.
  oneof kind {
    Fs fs = 1;
    S3 s3 = 2;
    Sftp sftp = 3;
  }
}

// A linked storage location: one OpenDAL operator plus Elysium metadata.
//
// Drives are project-scoped (docs/projects.md): every Drive carries a project_id
// and access resolves through org to project to team. The provider secret is never
// present; credential_set reports only whether one is configured.
message Drive {
  elysium.common.v1.Uuid id = 1;

  // The project this Drive belongs to. Drives are project-scoped, not loose in the
  // org; the auto-provisioned default Drive lands in the org's default project.
  elysium.common.v1.Uuid project_id = 2;

  // The owning org. Org isolation comes from this column, not from paths.
  elysium.common.v1.Uuid org_id = 3;

  string name = 4;
  DriveKind kind = 5;
  DriveVisibility visibility = 6;

  // Whether this is the org's single default Drive; drag-and-drop uploads land here.
  bool is_default = 7;

  // Whether a provider credential is sealed for this Drive. A boolean only: the
  // sealed secret is never sent to the client.
  bool credential_set = 8;

  // Capabilities this Drive's provider advertises; consumers bind against these.
  repeated StorageCapability capabilities = 9;

  // Non-secret connection settings; the active group matches `kind`.
  DriveConfig config = 10;

  elysium.common.v1.Timestamp created_at = 11;
  elysium.common.v1.Timestamp updated_at = 12;
}

// One entry in a directory listing or a search result.
//
// Deliberately identity-free: per-file sharing (stable file IDs, roles, share
// links) is a deferred pillar, so no stable-id or ACL fields live here.
message FileEntry {
  // Base name of the entry, e.g. "report.pdf".
  string name = 1;

  // Path within the Drive, provider-rooted.
  string path = 2;

  // Whether the entry is a directory.
  bool is_dir = 3;

  // Size in bytes; 0 for directories or when the provider omits it.
  uint64 size = 4;

  // Last-modified instant; unset when the provider omits it.
  elysium.common.v1.Timestamp modified = 5;

  // MIME type when known, e.g. "application/pdf"; empty otherwise.
  string mime = 6;
}

// The contents of one directory within a Drive.
message Listing {
  // The Drive being listed. A plain string echoing the request path parameter, not
  // a Uuid wrapper, since listings are a hot browse path.
  string drive_id = 1;

  // The directory path within the Drive; empty is the Drive root.
  string path = 2;

  repeated FileEntry entries = 3;
}

// One streamed frame of a federated search, emitted per source as it resolves.
//
// A search fans out to every Drive the caller can access; each Drive contributes
// one frame so fast providers light up while a slow one shows a spinner.
message SearchFrame {
  // Progress of the search against this one source.
  enum Status {
    STATUS_UNSPECIFIED = 0;
    // The source is still searching.
    STATUS_SEARCHING = 1;
    // The source finished and its matches are complete.
    STATUS_DONE = 2;
    // The source is unusually slow; results may still arrive.
    STATUS_SLOW = 3;
    // The source failed; `error` describes why.
    STATUS_ERROR = 4;
  }

  // The Drive this frame reports on. A plain string, matching Listing.drive_id.
  string drive_id = 1;

  // The Drive's display name, so the UI can attribute progress without a lookup.
  string drive_name = 2;

  Status status = 3;

  // Matches from this source so far.
  repeated FileEntry matches = 4;

  // Failure detail when `status` is STATUS_ERROR; empty otherwise.
  string error = 5;
}

// Request to search Drives, answered by a stream of SearchFrame messages.
//
// The response is a single chunked body of length-delimited SearchFrame messages:
// each frame is prefixed by its protobuf varint byte length, so the client frames the
// stream by reading a length then that many bytes, repeatedly. Frames arrive per
// source as it resolves; dropping the connection cancels the in-flight provider work.
message SearchRequest {
  // Case-insensitive substring matched against each entry's provider-rooted path.
  string query = 1;

  // Drives to search. When empty, every Drive the caller can access across their
  // accessible projects in the active organization is searched.
  repeated elysium.common.v1.Uuid drive_ids = 2;
}

// A single access grant on a restricted Drive: a team or a user.
message DriveAccess {
  // The kind of principal a grant targets.
  enum Principal {
    PRINCIPAL_UNSPECIFIED = 0;
    // The grant targets a team; all its members inherit access.
    PRINCIPAL_TEAM = 1;
    // The grant targets a single user.
    PRINCIPAL_USER = 2;
  }

  Principal principal = 1;

  // The team or user the grant targets, per `principal`.
  elysium.common.v1.Uuid principal_id = 2;
}

// Request to create a Drive under a project (admin, `manage_storage`).
//
// `credential` is write-only: the server seals it and never reads it back. Empty
// means no provider secret (valid for a local FS Drive).
message CreateDriveRequest {
  // The project to create the Drive in. Drives are project-scoped.
  elysium.common.v1.Uuid project_id = 1;

  string name = 2;
  DriveKind kind = 3;
  DriveVisibility visibility = 4;

  // Non-secret connection settings; the group must match `kind`.
  DriveConfig config = 5;

  // Write-only opaque provider secret, sealed server-side and never returned. The
  // server interprets it per `kind`; the client never receives it back.
  string credential = 6;
}

// Request to update a Drive's mutable fields (admin, `manage_storage`).
//
// Kind and project are immutable and absent here. An unset field leaves its value
// unchanged; `credential` empty keeps the existing sealed secret.
message UpdateDriveRequest {
  string name = 1;
  DriveVisibility visibility = 2;

  // Replacement non-secret settings; unset leaves them unchanged.
  DriveConfig config = 3;

  // Write-only opaque provider secret, sealed server-side and never returned.
  // Empty leaves the existing credential in place.
  string credential = 4;
}

// Request to replace the access grants on a restricted Drive (admin, `manage_storage`).
message SetDriveAccessRequest {
  // The full set of grants; replaces any existing grants on the Drive.
  repeated DriveAccess grants = 1;
}

// Request to move or rename an entry within a Drive (streaming transfer proxy).
//
// Both paths are provider-rooted and URL-decoded; `from` is the existing entry and
// `to` is its new location. Neither may touch the reserved `.elysium/` system prefix,
// and neither may escape the Drive root with `..` segments.
message MoveRequest {
  // The existing entry's path within the Drive.
  string from = 1;
  // The new path within the Drive.
  string to = 2;
}

// The Drives a caller can access within their active project scope.
message ListDrivesResponse {
  repeated Drive drives = 1;
}

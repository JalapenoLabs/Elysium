//
// Orchestration domain: service integrations, the control plane over managed and
// linked services.
//
// An integration is to services what a Drive is to files: an org owns many, of
// many kinds, each either MANAGED (Elysium provisions and owns a container) or
// LINKED (Elysium holds credentials to an external endpoint). Managed
// integrations are desired state in Postgres, reconciled to actual containers on
// boot and on change. See docs/integrations.md and docs/projects.md for the model
// these messages encode.

syntax = "proto3";

package elysium.integration.v1;

import "common.proto";

// What service an integration provides. Immutable for the life of an integration;
// determines the blessed default image (managed) and the storage roles it binds.
enum IntegrationKind {
  INTEGRATION_KIND_UNSPECIFIED = 0;
  // A git forge (managed: Forgejo; linked: GitHub, GitLab).
  INTEGRATION_KIND_GIT = 1;
  // A mail server (managed: self-hosted; linked: Gmail, Outlook).
  INTEGRATION_KIND_MAIL = 2;
  // A container registry (managed: CNCF distribution; linked: Docker Hub).
  INTEGRATION_KIND_REGISTRY = 3;
  // A Perforce-protocol server (managed: JalapenoLabs Astraval).
  INTEGRATION_KIND_PERFORCE = 4;
  // A CI runner / Claude agentic worker container.
  INTEGRATION_KIND_RUNNER = 5;
}

// Whether Elysium runs the service or merely connects to one that already exists.
enum IntegrationMode {
  INTEGRATION_MODE_UNSPECIFIED = 0;
  // Elysium provisions and owns the container lifecycle. Admin infrastructure.
  INTEGRATION_MODE_MANAGED = 1;
  // Elysium holds credentials to an external endpoint; no container.
  INTEGRATION_MODE_LINKED = 2;
}

// Which tier owns an integration (docs/projects.md).
//
// Work integrations default to PROJECT scope: each project's services run in
// their own isolated containers on the shared control plane. ORG covers the rare
// org-shared service; PERSONAL is a member's own linked account (never managed).
enum OwnerScope {
  OWNER_SCOPE_UNSPECIFIED = 0;
  OWNER_SCOPE_ORG = 1;
  OWNER_SCOPE_PROJECT = 2;
  OWNER_SCOPE_PERSONAL = 3;
}

// Who inside the org may see and use an org- or project-scoped integration,
// mirroring DriveVisibility. Admins and up always have access, enforced in the
// authz check and never stored. Irrelevant for PERSONAL scope (owner-only).
enum IntegrationVisibility {
  INTEGRATION_VISIBILITY_UNSPECIFIED = 0;
  // Every member with access to the owning tier can see and use it.
  INTEGRATION_VISIBILITY_ORG_WIDE = 1;
  // Access granted to a chosen mix of teams and users via integration_access.
  INTEGRATION_VISIBILITY_RESTRICTED = 2;
}

// The live provisioning state of a managed integration, as last reconciled.
//
// The reconciler walks PENDING -> PROVISIONING -> RUNNING (or FAILED); an
// explicit stop converges to STOPPED. Linked integrations never leave PENDING
// today (they have no container to reconcile). status_detail carries the
// human-readable reason for PENDING and FAILED.
enum ReconcileStatus {
  RECONCILE_STATUS_UNSPECIFIED = 0;
  // Recorded but not yet converged (e.g. waiting for a storage-role binding).
  RECONCILE_STATUS_PENDING = 1;
  // The reconciler is actively converging the container to the desired spec.
  RECONCILE_STATUS_PROVISIONING = 2;
  // The container is up and, if it has a health check, passing it.
  RECONCILE_STATUS_RUNNING = 3;
  // The container is provisioned but stopped, as desired.
  RECONCILE_STATUS_STOPPED = 4;
  // The last reconcile failed; status_detail says why.
  RECONCILE_STATUS_FAILED = 5;
}

// One storage-role binding: which Drive a managed service persists a role onto.
//
// Roles are per-kind (git: "repos"; registry: "blobs"; mail: "bodies"; perforce:
// "metadata", "archive"; runner: "workspace"), each requiring a storage
// capability the bound Drive must advertise. An ineligible binding is rejected,
// which is how "git on OneDrive" stays an enforced impossibility.
message IntegrationStorageBinding {
  // The consumer role being bound, e.g. "repos".
  string role = 1;

  // The capability-eligible Drive the role persists onto.
  elysium.common.v1.Uuid drive_id = 2;

  // Path prefix within the Drive; empty uses the reserved
  // ".elysium/<kind>/<role>" consumer area.
  string prefix = 3;
}

// A service integration: one managed container or one linked external service.
//
// Secrets never appear here: credential_set reports only whether one is sealed.
message Integration {
  elysium.common.v1.Uuid id = 1;

  // The owning project when owner_scope is PROJECT; unset otherwise.
  elysium.common.v1.Uuid project_id = 2;

  // The owning org. Org isolation comes from this column, always set.
  elysium.common.v1.Uuid org_id = 3;

  IntegrationKind kind = 4;
  IntegrationMode mode = 5;
  OwnerScope owner_scope = 6;
  string name = 7;
  IntegrationVisibility visibility = 8;

  // Live provisioning state the console renders, with its human-readable detail.
  ReconcileStatus status = 9;
  string status_detail = 10;

  // Whether a credential is sealed for this integration. A boolean only: the
  // sealed secret is never sent to the client.
  bool credential_set = 11;

  // Kind-specific non-secret settings as a JSON object. Typed per-kind messages
  // arrive with the per-service milestones; until then the shape is owned by
  // each kind's implementation and validated server-side as a JSON object.
  string config_json = 12;

  // Storage-role bindings (managed integrations only; empty for linked).
  repeated IntegrationStorageBinding bindings = 13;

  elysium.common.v1.Timestamp created_at = 14;
  elysium.common.v1.Timestamp updated_at = 15;
}

// Request to create an integration.
//
// Managed and org-linked creation require the `manage_integrations` capability
// (or project owner/admin for a project-scoped one); personal-linked creation is
// open to members, subject to per-kind org policy. `credential` is write-only:
// the server seals it and never returns it.
message CreateIntegrationRequest {
  // Required when owner_scope is PROJECT; must be unset otherwise.
  elysium.common.v1.Uuid project_id = 1;

  IntegrationKind kind = 2;
  IntegrationMode mode = 3;
  OwnerScope owner_scope = 4;
  string name = 5;
  IntegrationVisibility visibility = 6;

  // Kind-specific non-secret settings as a JSON object; empty means "{}".
  string config_json = 7;

  // Write-only opaque secret (API token, admin credential), sealed server-side
  // and never returned. Empty means none.
  string credential = 8;
}

// Request to update an integration's mutable fields. Kind, mode, scope, project,
// and org are immutable. An empty field leaves its value unchanged; an empty
// `credential` keeps the existing sealed secret.
message UpdateIntegrationRequest {
  string name = 1;
  IntegrationVisibility visibility = 2;

  // Replacement non-secret settings as a JSON object; empty leaves them unchanged.
  string config_json = 3;

  // Write-only opaque secret; empty keeps the existing one.
  string credential = 4;
}

// Request to replace a managed integration's storage-role bindings.
//
// The set replaces any existing bindings atomically. Every binding is
// capability-checked: the role must exist for the integration's kind and the
// Drive must advertise the role's required capability.
message SetIntegrationBindingsRequest {
  repeated IntegrationStorageBinding bindings = 1;
}

// The integrations a caller can access, with live status.
message ListIntegrationsResponse {
  repeated Integration integrations = 1;
}

// One per-kind member-linking toggle of an org's integration policy set.
//
// Governs PERSONAL LINKED creation only: a member may link their own account of
// this kind exactly while members_may_link is on. The default is off, per kind,
// until an admin enables it (docs/integrations.md). Managed and org-linked
// creation are gated by `manage_integrations` and never by these toggles.
message IntegrationPolicy {
  IntegrationKind kind = 1;
  bool members_may_link = 2;
}

// The org's full per-kind policy set, one entry for every known kind.
//
// A kind an admin never touched appears with members_may_link = false, so the
// console always renders the complete toggle board.
message GetIntegrationPoliciesResponse {
  repeated IntegrationPolicy policies = 1;
}

// Request to set one kind's members_may_link toggle. The response is the full
// refreshed policy set (GetIntegrationPoliciesResponse).
message UpdateIntegrationPolicyRequest {
  IntegrationKind kind = 1;
  bool members_may_link = 2;
}

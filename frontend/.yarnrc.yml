# Yarn Berry, linking into a real node_modules folder (no Plug'n'Play).
nodeLinker: node-modules

# Jalapeno Labs internal packages are installed straight from their public git
# repos (not published to npm), so they must be allowlisted here. They build via
# their `prepare` script on install, which needs scripts enabled.
approvedGitRepositories:
  - "https://github.com/jalapenolabs/cli.git"
  - "https://github.com/JalapenoLabs/uikit.git"
enableScripts: true

yarnPath: .yarn/releases/yarn-4.17.0.cjs

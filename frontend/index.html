<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elysium</title>
    <script>
      // Applies the saved theme before the first paint so dark mode never flashes
      // light. Mirrors src/theme/themePreference.ts, which takes over once React loads.
      (function () {
        var preference = 'system'
        try {
          preference = localStorage.getItem('elysium.theme') || 'system'
        }
        catch (error) {}
        var theme = preference === 'dark' || preference === 'light'
          ? preference
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        var root = document.documentElement
        root.classList.add(theme)
        root.dataset.theme = theme
        root.style.colorScheme = theme
      })()
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

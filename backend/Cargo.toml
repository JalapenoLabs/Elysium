[package]
name = "elysium"
description = "The Elysium control plane: one self-hosted workspace for mail, chat, storage, source control, and agents."
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Jalapeno Labs"]
repository = "https://github.com/JalapenoLabs/elysium"
publish = false

[dependencies]
# Anubis publishes as `anubis-framework`, because the plain name is held on
# crates.io by an unrelated crate. The `package` key renames it back, so every
# `use anubis::` in this application reads the way the docs write it. Keep the
# key when the source below becomes a published version:
#   anubis = { package = "anubis-framework", version = "0.3.0" }
#
# Pinned to an exact revision rather than a branch, because a floating branch
# changes the framework between two builds believed identical. `frontend/
# package.json` pins the same revision and the two must not drift, so bumping
# them is a commit of its own. See docs/anubis.md.
anubis = { package = "anubis-framework", git = "https://github.com/JalapenoLabs/Anubis.git", rev = "89f1e97b1e8bfe04944fe1585b2c5d1b7558ec90" }
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
# The libpq-linked "postgres" feature stays off; connections go through
# diesel-async's pure-Rust tokio-postgres backend so builds need no native libs.
diesel = { version = "2.3", features = ["postgres_backend", "chrono", "uuid", "serde_json"] }
diesel-async = { version = "0.9", features = ["postgres", "deadpool", "async-connection-wrapper"] }
diesel_migrations = "2.3"
mimalloc = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

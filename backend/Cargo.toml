[package]
name = "elysium-backend"
version = "0.1.0"
edition = "2021"
description = "Minimal Axum API for the Elysium base template, wired to Postgres."

[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["time"] }
futures-core = "0.3"
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid"] }
# Session ids and OIDC state/PKCE-verifier generation (v4 is CSPRNG-backed).
uuid = { version = "1", features = ["v4"] }
# Encodes WebAuthn credential ids for storage/lookup.
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
mimalloc = "0.1"
# Generated protobuf types (see build.rs) share this runtime.
prost = "0.13"
# The API is the WebAuthn Relying Party (see docs/auth-model.md); it runs the
# passkey ceremony itself rather than delegating to Keycloak. The
# state-serialisation feature lets the in-flight ceremony state ride a short-lived
# HttpOnly cookie between begin and finish (stored carefully, per its "danger" name).
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }

[build-dependencies]
# Compiles the shared `../proto` tree into Rust at build time.
prost-build = "0.13"

# A slightly optimized debug profile keeps hot-reload rebuilds quick while
# still producing usable backtraces during development.
[profile.dev]
opt-level = 0
debug = 1

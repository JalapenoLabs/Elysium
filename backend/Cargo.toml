[package]
name = "elysia-backend"
version = "0.1.0"
edition = "2021"
description = "Minimal Axum API for the Elysia base template, wired to Postgres."

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
mimalloc = "0.1"
# Generated protobuf types (see build.rs) share this runtime.
prost = "0.13"

[build-dependencies]
# Compiles the shared `../proto` tree into Rust at build time.
prost-build = "0.13"

# A slightly optimized debug profile keeps hot-reload rebuilds quick while
# still producing usable backtraces during development.
[profile.dev]
opt-level = 0
debug = 1

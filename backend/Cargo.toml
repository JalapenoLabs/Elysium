[package]
name = "elysium-backend"
version = "0.1.0"
edition = "2021"
description = "Minimal Axum API for the Elysium base template, wired to Postgres."

[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["time"] }
futures-core = "0.3"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid"] }
# Session ids and OIDC state/PKCE-verifier generation (v4 is CSPRNG-backed).
uuid = { version = "1", features = ["v4"] }
# PKCE: random verifier (getrandom) hashed to the S256 challenge (sha2).
getrandom = "0.2"
sha2 = "0.10"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
mimalloc = "0.1"
# Generated protobuf types (see build.rs) share this runtime.
prost = "0.13"
# Validates Keycloak-issued JWTs against the realm's JWKS.
jsonwebtoken = "9"
# Fetches the JWKS from Keycloak; rustls to match the sqlx TLS stack.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[build-dependencies]
# Compiles the shared `../proto` tree into Rust at build time.
prost-build = "0.13"

# A slightly optimized debug profile keeps hot-reload rebuilds quick while
# still producing usable backtraces during development.
[profile.dev]
opt-level = 0
debug = 1

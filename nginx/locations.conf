# The locations the production and development stacks route alike, included inside the
# server block of default.conf and of development.conf. Only `location /` (and, in
# development, `/api/`) differs between the two, and lives in those files.

# Agents in the workspace call Elysium's tool servers on the agents' network, never through
# here. A grant's bearer token is the real check; ending the path at the edge keeps the tool
# servers off the public origin altogether.
location ^~ /api/agent-tools {
    return 404;
}

# Cover uploads, up to 10 MB each; the API compresses them before storing.
location ~ ^/api/v1/projects/[^/]+/cover$ {
    client_max_body_size 10m;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Files attached to knowledge base pages, up to 50 MB each (`MAX_ATTACHMENT_BYTES`), which this
# must stay at or above. nginx keeps the file until it has arrived whole, so a slow connection
# never reaches the API, and then waits while the API hands it to a storage provider: the read
# timeout is that route's own deadline (`crate::middleware::request_timeout`).
location ~ ^/api/v1/pages/[^/]+/attachments$ {
    client_max_body_size 50m;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
}

# Kratos's public API: self-service flows, sessions, and the passkey script. Its admin
# API is never published. Kratos serves from its root, so the prefix is stripped.
location /api/identity/ {
    proxy_pass http://kratos:4433/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Ending a session is the API's to do (`POST /api/v1/auth/sign-out`, `DELETE
# /api/v1/me/sessions`), since it must forget the session it cached at once, and Kratos tells
# it nothing about a logout or a session ended through its own routes. So browsers reach
# neither Kratos's logout flow nor anything but reading their sessions. See docs/auth.md.
location ^~ /api/identity/self-service/logout {
    return 404;
}

location ^~ /api/identity/sessions {
    limit_except GET {
        deny all;
    }
    proxy_pass http://kratos:4433/sessions;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# The submissions that check a password or send a recovery link, throttled per client.
location ~ ^/api/identity/self-service/(login|registration|recovery)$ {
    limit_req zone=identity_submit burst=5 nodelay;
    limit_req_status 429;
    rewrite ^/api/identity/(.*)$ /$1 break;
    proxy_pass http://kratos:4433;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# The server-sent event stream every open page holds. Buffering would hold events
# back, and the API's 15-second keep-alive comments keep the connection inside the
# read timeout.
location = /api/v1/events {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}

# A browser's stream: the WebSocket a viewer negotiates its media over (docs/browser.md). The
# API checks the session and the origin; nginx only has to pass the upgrade along and keep an
# idle socket open, which Neko's heartbeats do every few seconds.
location ~ ^/api/v1/browser-sessions/[^/]+/stream$ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
}

# Ory Hydra's public API: OAuth for MCP clients. Hydra serves from its root, at the same paths
# it advertises, so nothing is stripped. Client registration, below, goes to the API instead.
location /oauth2/ {
    proxy_pass http://hydra:4444;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Registering an MCP client, and managing a registration with its token (RFC 7591 and 7592), at
# the paths Hydra advertises. The API relays both to Hydra's public API and leaves out the empty
# fields Hydra fills its answers with, which strict clients such as Claude Code refuse
# (api/src/oauth/registration.rs). Anyone may register, so these are throttled per address.
location ~ ^/oauth2/register(/[^/]+)?$ {
    limit_req zone=oauth_register burst=12 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Hydra's discovery documents: what an MCP client reads to find the endpoints above.
location ~ ^/\.well-known/(openid-configuration|oauth-authorization-server|jwks\.json)$ {
    proxy_pass http://hydra:4444;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# The MCP server's protected resource metadata, which names Hydra as its authorization server.
# The API serves it, at the root and under the MCP path (RFC 9728). In development the web app's
# paths go to Vite, so this must reach the API explicitly.
location ^~ /.well-known/oauth-protected-resource {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# The locations the production and development stacks route alike, included inside the
# server block of default.conf and of development.conf. Only `location /` (and, in
# development, `/api/`) differs between the two, and lives in those files.

# Cover uploads, up to 10 MB each; the API compresses them before storing.
location ~ ^/api/v1/projects/[^/]+/cover$ {
    client_max_body_size 10m;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Kratos's public API: self-service flows, sessions, and the passkey script. Its admin
# API is never published. Kratos serves from its root, so the prefix is stripped.
location /api/identity/ {
    proxy_pass http://kratos:4433/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# The submissions that check a password or send a recovery link, throttled per client.
location ~ ^/api/identity/self-service/(login|registration|recovery)$ {
    limit_req zone=identity_submit burst=5 nodelay;
    limit_req_status 429;
    rewrite ^/api/identity/(.*)$ /$1 break;
    proxy_pass http://kratos:4433;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# The server-sent event stream every open page holds. Buffering would hold events
# back, and the API's 15-second keep-alive comments keep the connection inside the
# read timeout.
location = /api/v1/events {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}

# Ory Hydra's public API: OAuth for MCP clients. Hydra serves from its root, at the same paths
# it advertises, so nothing is stripped.
location /oauth2/ {
    proxy_pass http://hydra:4444;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location = /oauth2/register {
    limit_req zone=oauth_register burst=12 nodelay;
    limit_req_status 429;
    proxy_pass http://hydra:4444;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Hydra's discovery documents: what an MCP client reads to find the endpoints above.
location ~ ^/\.well-known/(openid-configuration|oauth-authorization-server|jwks\.json)$ {
    proxy_pass http://hydra:4444;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# The MCP server's protected resource metadata, which names Hydra as its authorization server.
# The API serves it, at the root and under the MCP path (RFC 9728). In development the web app's
# paths go to Vite, so this must reach the API explicitly.
location ^~ /.well-known/oauth-protected-resource {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

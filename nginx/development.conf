# The development stack's routing, mounted over default.conf by compose.dev.yml.
# Single public origin for the stack. `/api/identity/` reaches Ory Kratos, the rest of
# `/api/` reaches the Rust API, and everything else reaches the Vite dev server, so the
# browser never sees a second host. The locations both stacks share are in locations.conf.

server {
    listen 80;
    server_tokens off;

    # The API caps bodies at 1 MiB as well; rejecting here saves the round trip.
    client_max_body_size 1m;

    include /etc/nginx/locations.conf;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API rate limits per client IP using these; it trusts them only
        # because it is reachable exclusively through this proxy.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # $host drops the port; the OAuth callback needs the address the browser used.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }

    # Everything else is the Vite dev server.
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Vite's HMR websocket rides the same path as the page.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;

        # The API sets its own hardening headers; these cover the dev server's pages. No
        # CSP: Vite's dev server needs inline scripts and websockets that the production
        # policy forbids. The production build gets that policy from the API.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }
}

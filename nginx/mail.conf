# Inbound mail. nginx is the stack's single ingress, so it accepts the mail ports and hands
# each connection to Stalwart untouched: TLS on 465 and 993, and STARTTLS on 25, are
# Stalwart's to negotiate, and nginx holds no certificate for them.
#
# Every connection starts with a PROXY protocol header carrying the client's real address.
# Without it Stalwart would see nginx as the sender of all mail, and SPF checks, rate
# limits, and blocklists would judge the wrong address. Stalwart accepts that header only
# from nginx's fixed address on the mail network (MAIL_INGRESS_ADDRESS in compose.yml).

# Docker's embedded DNS. Stalwart is resolved per connection rather than at startup: the
# API creates it on demand, so it may not exist when nginx starts, or ever.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

map $server_port $mail_upstream {
    25  stalwart:25;
    465 stalwart:465;
    993 stalwart:993;
}

server {
    # SMTP from other mail servers, with STARTTLS.
    listen 25;
    # Mail submission from clients, TLS from the first byte.
    listen 465;
    # IMAP for clients, TLS from the first byte.
    listen 993;

    proxy_pass $mail_upstream;
    proxy_protocol on;
    proxy_connect_timeout 5s;
    # IMAP clients hold idle connections open; servers expect them to survive long pauses.
    proxy_timeout 30m;
}

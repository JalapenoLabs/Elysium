# The image's default main configuration, plus a stream block: mail ports are raw TCP, which
# only the main context can proxy. HTTP routing lives in default.conf (development.conf in
# the development stack) and locations.conf, mail in mail.conf.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Password guessing against Kratos: signing in, signing up, and recovery answer at most
    # 5 submissions a minute per client address, after a burst of 5. Self-hosted Kratos has no
    # brute-force protection of its own, and nginx is the one component that sees every
    # attempt. Only POSTs count; loading a form is free. See docs/security.md.
    #
    # The client address is the peer's, or what a trusted proxy in front reports
    # (real-ip.conf.template). Behind a proxy nginx does not trust, every client counts as one.
    #
    # Upstreams get X-Forwarded-For set to that one address, never appended to what the client
    # sent, so the API's rate limiter cannot be handed a made-up address.
    map $request_method $identity_submit_client {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $identity_submit_client zone=identity_submit:10m rate=5r/m;

    # Registering an OAuth client is open to anyone, as MCP clients register themselves, so it
    # is throttled per client address: 12 a minute, after a burst of 12. A client reaches
    # nothing until an approved person consents to it. See docs/mcp.md.
    limit_req_zone $binary_remote_addr zone=oauth_register:1m rate=12r/m;

    include /etc/nginx/conf.d/*.conf;
}

stream {
    include /etc/nginx/stream.d/*.conf;
}

# Browser media. Each browser the API runs (docs/browser.md) receives its WebRTC media on one
# port from this range, over UDP and TCP, and names that port and the host's public address
# in its candidates. nginx passes each port to the browser that owns it, as raw datagrams and
# streams it does not read: media is encrypted between the viewer and the browser.
#
# A browser on port 59003 answers as `elysium-browser-59003` on its own Docker network, which
# the API joins nginx to. The range here, in compose.yml, in the API (crate::browser::PORTS),
# and in the browser_sessions table's check change together.

server {
    listen 59000-59007;
    listen 59000-59007 udp;

    # Docker's embedded DNS. Browsers are resolved per connection: the API creates them on
    # demand, and joins nginx to each one's network after nginx starts. mail.conf sets the
    # same resolver for the whole stream block; it is repeated here so this file stands alone.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    proxy_pass elysium-browser-$server_port:$server_port;
    proxy_connect_timeout 5s;
    # Media flows continuously while someone watches; a quiet minute means nobody is.
    proxy_timeout 1m;
}

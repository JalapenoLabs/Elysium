# Single public origin for the stack. `/api/identity/` reaches Ory Kratos, the rest of
# `/api/` reaches the Rust API, and everything else reaches the Vite dev server, so the
# browser never sees a second host.

# Password guessing against Kratos: signing in, signing up, and recovery answer at most
# 5 submissions a minute per client address, after a burst of 5. Self-hosted Kratos has no
# brute-force protection of its own, and nginx is the one component that sees every
# attempt. Only POSTs count; loading a form is free. See docs/security.md.
#
# The client address is the peer's, or what a trusted proxy in front reports
# (real-ip.conf.template). Behind a proxy nginx does not trust, every client counts as one.
#
# Upstreams get X-Forwarded-For set to that one address, never appended to what the client
# sent, so the API's rate limiter cannot be handed a made-up address.
map $request_method $identity_submit_client {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $identity_submit_client zone=identity_submit:10m rate=5r/m;

# Registering an OAuth client is open to anyone, as MCP clients register themselves, so it is
# throttled per client address: 12 a minute, after a burst of 12. A client reaches nothing until
# an approved person consents to it. See docs/mcp.md.
limit_req_zone $binary_remote_addr zone=oauth_register:1m rate=12r/m;

server {
    listen 80;
    server_tokens off;

    # The API caps bodies at 1 MiB as well; rejecting here saves the round trip.
    client_max_body_size 1m;

    # Cover uploads, up to 10 MB each; the API compresses them before storing.
    location ~ ^/api/v1/projects/[^/]+/cover$ {
        client_max_body_size 10m;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Kratos's public API: self-service flows, sessions, and the passkey script. Its admin
    # API is never published. Kratos serves from its root, so the prefix is stripped.
    location /api/identity/ {
        proxy_pass http://kratos:4433/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The submissions that check a password or send a recovery link, throttled per client.
    location ~ ^/api/identity/self-service/(login|registration|recovery)$ {
        limit_req zone=identity_submit burst=5 nodelay;
        limit_req_status 429;
        rewrite ^/api/identity/(.*)$ /$1 break;
        proxy_pass http://kratos:4433;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Ory Hydra's public API: OAuth for MCP clients. Hydra serves from its root, at the same
    # paths it advertises, so nothing is stripped.
    location /oauth2/ {
        proxy_pass http://hydra:4444;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /oauth2/register {
        limit_req zone=oauth_register burst=12 nodelay;
        limit_req_status 429;
        proxy_pass http://hydra:4444;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hydra's discovery documents: what an MCP client reads to find the endpoints above.
    location ~ ^/\.well-known/(openid-configuration|oauth-authorization-server|jwks\.json)$ {
        proxy_pass http://hydra:4444;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The MCP server's protected resource metadata, which names Hydra as its authorization
    # server. The API serves it, at the root and under the MCP path (RFC 9728).
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API rate limits per client IP using these; it trusts them only
        # because it is reachable exclusively through this proxy.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # $host drops the port; the OAuth callback needs the address the browser used.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }

    # The server-sent event stream every open page holds. Buffering would hold events
    # back, and the API's 15-second keep-alive comments keep the connection inside the
    # read timeout.
    location = /api/v1/events {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Vite's HMR websocket rides the same path as the page.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;

        # The API sets its own hardening headers; these cover the SPA. No CSP yet:
        # Vite's dev server needs inline scripts and websockets that a strict policy
        # would block, so that belongs with the production static build.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }
}

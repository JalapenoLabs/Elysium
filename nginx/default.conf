# Single public origin for the stack. `/api/` reaches the Rust API, everything
# else reaches the Vite dev server, so the browser never sees a second host.

server {
    listen 80;
    server_tokens off;

    # The API caps bodies at 1 MiB as well; rejecting here saves the round trip.
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API rate limits per client IP using these; it trusts them only
        # because it is reachable exclusively through this proxy.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # $host drops the port; the OAuth callback needs the address the browser used.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }

    # The server-sent event stream every open page holds. Buffering would hold events
    # back, and the API's 15-second keep-alive comments keep the connection inside the
    # read timeout.
    location = /api/v1/events {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Vite's HMR websocket rides the same path as the page.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;

        # The API sets its own hardening headers; these cover the SPA. No CSP yet:
        # Vite's dev server needs inline scripts and websockets that a strict policy
        # would block, so that belongs with the production static build.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }
}

# The production stack's routing. Single public origin for the stack: `/api/identity/`
# reaches Ory Kratos, and every other path reaches the API, which serves both `/api` and
# the web app's production build, so the browser never sees a second host.
# compose.dev.yml mounts development.conf over this file, which sends the web app's paths
# to the Vite dev server instead. The locations both stacks share are in locations.conf.

server {
    listen 80;
    server_tokens off;

    # The API caps bodies at 1 MiB as well; rejecting here saves the round trip.
    client_max_body_size 1m;

    include /etc/nginx/locations.conf;

    # Kratos calls the API's /internal routes on the compose network. They are never
    # published, so a path under /internal ends here rather than reaching the API.
    location ^~ /internal {
        return 404;
    }

    # `/api` and the web app alike. The API sets every hardening header, including a
    # Content Security Policy for the app's pages, so nginx adds none.
    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API rate limits per client IP using these; it trusts them only
        # because it is reachable exclusively through this proxy.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # $host drops the port; the OAuth callback needs the address the browser used.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }
}

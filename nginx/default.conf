# Single public origin for the stack. Every path reaches the API, which serves both
# `/api` and the web app's production build, so the browser never sees a second host.
# nginx stays in front for the mail ports and for the per-path body limits and timeouts
# below. compose.dev.yml mounts development.conf over this file, which sends the web
# app's paths to the Vite dev server instead; keep the /api locations in step with it.

server {
    listen 80;
    server_tokens off;

    # The API caps bodies at 1 MiB as well; rejecting here saves the round trip.
    client_max_body_size 1m;

    # Cover uploads, up to 10 MB each; the API compresses them before storing.
    location ~ ^/api/v1/projects/[^/]+/cover$ {
        client_max_body_size 10m;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The server-sent event stream every open page holds. Buffering would hold events
    # back, and the API's 15-second keep-alive comments keep the connection inside the
    # read timeout.
    location = /api/v1/events {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # `/api` and the web app alike. The API sets every hardening header, including a
    # Content Security Policy for the app's pages, so nginx adds none.
    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API rate limits per client IP using these; it trusts them only
        # because it is reachable exclusively through this proxy.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # $host drops the port; the OAuth callback needs the address the browser used.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }
}

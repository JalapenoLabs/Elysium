# The compose files. The application images they build are checked by the API,
# frontend, and OAuth broker workflows; this one proves the files themselves still
# parse and interpolate, and that the configuration images (Kratos, Hydra, nginx, the
# updater) build. See docs/ci.md.
name: Compose

# Deliberately unfiltered by path. Every job here is a required check, GitHub
# never evaluates path filters for merge groups, and a required check whose
# workflow a path filter skipped stays pending forever. See docs/ci.md.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Compose config
    # A fork's pull request is skipped, so a fork's code first runs once a
    # maintainer queues it, in the merge group, where every check runs again.
    # Pushes, merge groups, and manual runs always come from this repository, so
    # the guard never skips those.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The Compose a deployment's updater runs, from the docker CLI image
      # updater/Dockerfile pins, so the stacks are checked by the version that applies
      # them. The runner's own Compose is older and refuses fields they use, such as
      # `build.provenance`. The release binary is checked against the checksum
      # published beside it, and takes precedence as the user's own plugin.
      - name: Install the updater's Compose
        run: |
          set -euo pipefail
          updater_image="$(sed -n 's/^FROM //p' updater/Dockerfile)"
          version="$(docker run --rm "${updater_image}" docker compose version --short)"
          release="https://github.com/docker/compose/releases/download/v${version}"
          binary="docker-compose-linux-x86_64"
          cd "${RUNNER_TEMP}"

          curl -fsSL -o "${binary}" "${release}/${binary}"
          curl -fsSL -o "${binary}.sha256" "${release}/${binary}.sha256"
          sha256sum --check "${binary}.sha256"

          mkdir -p "${HOME}/.docker/cli-plugins"
          install -m 0755 "${binary}" "${HOME}/.docker/cli-plugins/docker-compose"
          test "$(docker compose version --short)" = "${version}"
          echo "Compose ${version}, as ${updater_image} carries."

      # Compose refuses every command, `config` included, while a required variable
      # is unset, and the checkout has no environment file. These placeholders exist
      # only to satisfy interpolation: nothing starts, and no value here is a secret.
      - name: Validate the Elysium stack
        env:
          POSTGRES_USER: ci-placeholder
          POSTGRES_PASSWORD: ci-placeholder
          POSTGRES_DB: ci-placeholder
          REDIS_PASSWORD: ci-placeholder
          ELYSIUM_ENCRYPTION_KEY: ci-placeholder
        run: docker compose --file compose.yml config --quiet

      # The override must still merge: same-target volumes replace, and its services
      # and dependencies resolve against the production file.
      - name: Validate the development stack
        env:
          POSTGRES_USER: ci-placeholder
          POSTGRES_PASSWORD: ci-placeholder
          POSTGRES_DB: ci-placeholder
          REDIS_PASSWORD: ci-placeholder
          ELYSIUM_ENCRYPTION_KEY: ci-placeholder
        run: docker compose --file compose.yml --file compose.dev.yml config --quiet

      # A deploy recreates a service only when its definition or image changes, so no stack
      # may bind-mount configuration, and each image needs one builder (#153). The script
      # sets its own placeholders, like the steps above.
      - name: Check every stack builds its configuration into images
        run: python3 .github/scripts/check-compose.py

      - name: Validate the OAuth broker stack
        env:
          BROKER_PUBLIC_URL: http://127.0.0.1
          BROKER_SEALING_KEY: ci-placeholder
        run: docker compose --file oauth-broker/compose.yml config --quiet

  configuration-images:
    name: Configuration images
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [ self-hosted, linux, rocky9, docker ]

    env:
      # Unique per run, because runners in the pool can share one Docker daemon.
      TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The images compose.yml builds from kratos/, hydra/, and updater/, built the way it
      # builds them, so a file their Dockerfiles copy cannot go missing unnoticed.
      - name: Build the Kratos, Hydra, and updater images
        run: |
          set -euo pipefail
          for directory in kratos hydra updater; do
            docker build --provenance=false --tag "elysium-${directory}:${TAG}" "${directory}"
          done

      # Both routings, with every upstream name resolvable, since nginx resolves them
      # when it reads its configuration.
      - name: Build the nginx images and test their configuration
        run: |
          set -euo pipefail
          for target in production development; do
            docker build --provenance=false --target "${target}" --tag "elysium-nginx:${TAG}-${target}" nginx
            docker run --rm \
              --env TRUSTED_PROXY_ADDRESSES=127.0.0.1/32 \
              --add-host api:127.0.0.1 --add-host kratos:127.0.0.1 \
              --add-host hydra:127.0.0.1 --add-host frontend:127.0.0.1 \
              "elysium-nginx:${TAG}-${target}" nginx -t
          done

      - name: Remove the CI tags
        if: always()
        run: |
          docker rmi --force \
            "elysium-kratos:${TAG}" \
            "elysium-hydra:${TAG}" \
            "elysium-updater:${TAG}" \
            "elysium-nginx:${TAG}-production" \
            "elysium-nginx:${TAG}-development" \
            > /dev/null 2>&1 || true

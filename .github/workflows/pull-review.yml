
name: Request automated PR review
run-name: "Request review · PR #${{ github.event.pull_request.number }}"

# `ready_for_review` is listed because the default set is only `opened`,
# `synchronize`, and `reopened`. The review skips drafts and picks one up when
# the author marks it ready, which emits `ready_for_review` and nothing else.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# This workflow reads nothing and writes nothing on this repository.
permissions: {}

jobs:
  request-review:
    # A fork's pull request gets no secrets, so it could not request a review
    # anyway; skipping it keeps the run from failing on a missing token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the review
        env:
          GH_TOKEN: ${{ secrets.REVIEW_DISPATCH_TOKEN }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::REVIEW_DISPATCH_TOKEN is not set on this repository; no review was requested."
            exit 1
          fi

          gh workflow run review-dispatch.yml \
            --repo JalapenoLabs/github-actions \
            --ref main \
            -f repository-name="$REPOSITORY_NAME" \
            -f pull-request-number="$PR_NUMBER" \
            -f event-action="$EVENT_ACTION" \
            -f before-sha="$BEFORE_SHA"
          echo "Requested a review of $REPOSITORY_NAME#$PR_NUMBER. It runs in JalapenoLabs/github-actions."

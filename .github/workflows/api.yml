# The Rust API. Formatting, lints, tests, the migrations, and the image are
# separate jobs, so they run side by side and each failure is reported on its
# own. See docs/ci.md.
name: API

# Deliberately unfiltered by path. Every job here is a required check, GitHub
# never evaluates path filters for merge groups, and a required check whose
# workflow a path filter skipped stays pending forever. See docs/ci.md.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail on any compiler warning. The crate warns on a long list of lints, and
  # letting them through would make that list decorative.
  RUSTFLAGS: '-D warnings'
  # Incremental artifacts only pay off when one file is edited and rebuilt again
  # and again, which CI never does.
  CARGO_INCREMENTAL: '0'

jobs:
  format:
    name: API format
    # A fork's pull request is skipped, so a fork's code first runs once a
    # maintainer queues it, in the merge group, where every check runs again.
    # Pushes, merge groups, and manual runs always come from this repository, so
    # the guard never skips those.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Prepare the toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          crate: api

      - name: Check formatting
        working-directory: api
        run: cargo fmt --all -- --check

  clippy:
    name: API clippy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Prepare the toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          crate: api
          cache: api-clippy

      # `--all-targets` covers the tests, which is where lint debt accumulates
      # when only the binary is checked.
      - name: Clippy
        working-directory: api
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: API test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Prepare the toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          crate: api
          cache: api-test

      # The library and the library's tests are each one compile of 10 to 13 GB, and
      # `cargo test` builds both at once, more than the runner's 16 GB. Building the
      # library's tests alone first leaves `cargo test` only the library and the
      # binaries to build. See docs/ci.md, API.
      - name: Build the library's tests
        working-directory: api
        run: cargo test --locked --lib --no-run

      # The hermetic suite. Database-backed tests are ignored here and run in the
      # migrations job, which provides the Postgres they need.
      - name: Test
        working-directory: api
        run: cargo test --locked

  migrations:
    name: API migrations
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04

    env:
      # Must match the version api/scripts/verify-migrations.sh and docs/database.md name.
      DIESEL_VERSION: '2.3.13'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # `cargo test` compiles the same dependencies the same way whichever targets it
      # builds, so this job and `API test` share one dependency cache.
      - name: Prepare the toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          crate: api
          cache: api-test

      # The release binary rather than `cargo install`: it is built with libpq
      # bundled, so the job needs no Postgres client library, and it costs a
      # download instead of a compile. It is verified against the checksum
      # published beside it.
      - name: Install the Diesel CLI
        run: |
          set -euo pipefail
          release="https://github.com/diesel-rs/diesel/releases/download/v${DIESEL_VERSION}"
          archive="diesel_cli-x86_64-unknown-linux-gnu.tar.xz"
          install_dir="${RUNNER_TEMP}/diesel"
          mkdir -p "${install_dir}"
          cd "${install_dir}"

          curl -fsSL -o "${archive}" "${release}/${archive}"
          curl -fsSL -o "${archive}.sha256" "${release}/${archive}.sha256"
          sha256sum --check "${archive}.sha256"

          tar -xJf "${archive}" --strip-components=1
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Confirm the Diesel CLI version
        run: |
          set -euo pipefail
          diesel --version
          diesel --version | grep --quiet --fixed-strings "Version: ${DIESEL_VERSION}"

      # The migrations are proven against the disposable Postgres the script starts, so it must
      # be the image production runs, pinned by the same digest.
      - name: Check the disposable Postgres is the one compose runs
        run: |
          set -euo pipefail
          compose_image="$(sed -n '/^  postgres:$/,/^  [a-z]/s/^    image: //p' compose.yml)"
          script_image="$(sed -n 's/^readonly POSTGRES_IMAGE="\(.*\)"$/\1/p' api/scripts/verify-migrations.sh)"
          if [ -z "${compose_image}" ] || [ "${compose_image}" != "${script_image}" ]; then
            echo "::error::verify-migrations.sh runs '${script_image}', but compose.yml runs '${compose_image}'."
            exit 1
          fi
          echo "Both run ${compose_image}."

      # The script starts its own disposable Postgres and Redis on ports Docker picks,
      # named after the script's process id, exactly as a developer runs it. Its
      # process id is recorded so the cleanup step below can remove exactly those
      # containers when a cancelled run kills the script before its own cleanup runs.
      - name: Verify the migrations
        run: |
          set -euo pipefail
          api/scripts/verify-migrations.sh &
          script_pid=$!
          echo "${script_pid}" > "${RUNNER_TEMP}/verify-migrations.pid"
          wait "${script_pid}"

      # With their volumes, as the script removes them. A run that ended on its own
      # has nothing left here, and nothing else removes them, so nothing races this.
      - name: Remove the disposable Postgres and Redis
        if: always()
        run: |
          set -euo pipefail
          pid_file="${RUNNER_TEMP}/verify-migrations.pid"
          if [ ! -f "${pid_file}" ]; then
            echo "The migrations never started, so there is no container to remove."
            exit 0
          fi
          pid="$(cat "${pid_file}")"
          removed=0
          for name in "elysium-verify-migrations-${pid}" "elysium-verify-redis-${pid}"; do
            if docker container inspect "${name}" > /dev/null 2>&1; then
              docker rm --force --volumes "${name}" > /dev/null
              echo "Removed ${name}."
              removed=$((removed + 1))
            fi
          done
          if [ "${removed}" -eq 0 ]; then
            echo "The script removed its own containers; nothing was left."
          fi

  image:
    name: API image
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04

    env:
      IMAGE: elysium-api:ci
      # The BuildKit the image builds with, pinned like any other image.
      BUILDKIT_IMAGE: moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The image compiles with its own FROM lines, not rust-toolchain.toml or
      # frontend/.nvmrc, so they are compared here rather than trusted to be edited
      # together.
      - name: Check the image uses the pinned toolchains
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' api/rust-toolchain.toml)"
          if ! grep --quiet --fixed-strings "FROM rust:${channel}-" api/Dockerfile; then
            echo "::error::api/Dockerfile does not build with rust ${channel} from api/rust-toolchain.toml."
            exit 1
          fi
          echo "api/Dockerfile builds with rust ${channel}."

          node_version="$(cat frontend/.nvmrc)"
          if ! grep --quiet --fixed-strings "FROM node:${node_version}-" api/Dockerfile; then
            echo "::error::api/Dockerfile does not build the web app with Node ${node_version} from frontend/.nvmrc."
            exit 1
          fi
          echo "api/Dockerfile builds the web app with Node ${node_version}."

      # BuildKit in a container of its own, which can keep layers in the Actions
      # cache; Docker's built-in builder cannot.
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      # The `app` stage, from the repository root, the stage and context the publish
      # workflow builds, loaded into Docker for the checks below rather than pushed. Its
      # layers come from the Actions cache, so a commit that changes no dependency
      # starts from the compiled dependencies (cargo-chef's cook layer) and the web
      # app's installed packages, and compiles only the crate. Only pushes to main
      # save it: the layer a commit's own compile makes is never reused, and saving
      # one from every pull request would evict the Rust jobs' caches.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # A record of each build, uploaded as an artifact nothing here reads.
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: api/Dockerfile
          target: app
          tags: ${{ env.IMAGE }}
          load: true
          provenance: false
          cache-from: type=gha,scope=api-image
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=api-image,mode=max' || '' }}

      # Booting either process needs Postgres, Redis, and an encryption key. Running
      # each CLI still proves the runtime stage: both binaries start and find every
      # library they link.
      - name: Run the binaries in the image
        run: |
          docker run --rm "${IMAGE}" elysium-api --help
          docker run --rm "${IMAGE}" elysium-engine --help

      # The API refuses to start without the build FRONTEND_DIR names, so a missing
      # one would otherwise surface only when a deployment boots.
      - name: Check the image carries the web app
        run: docker run --rm --entrypoint sh "${IMAGE}" -c 'test -f "${FRONTEND_DIR}/index.html"'

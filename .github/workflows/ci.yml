# Copyright © 2026 Jalapeno Labs
#
# Continuous integration for Elysium.
#
# Verifies every push to `main` (and every pull request targeting it). The jobs
# run in parallel and are deliberately independent, so a failure in one does not
# cancel the others: you get the full picture in a single run rather than a
# fail-fast stop at the first red check. Within a job every check still runs even
# after an earlier one fails (via `if: ${{ !cancelled() }}`, or continue-on-error
# plus a final status report), then the job reports failed if any check failed.
#
# The test jobs run on the self-hosted Fedora runners tagged `non-earthly`, which
# keep warm on-disk caches (cargo target/registry, yarn/node_modules, docker
# layers) across runs. That is why there are no explicit cache actions and why the
# checkouts that benefit use `clean: false` to preserve those build dirs. Package
# installs use `dnf` (Fedora), not `apt-get`. The heavy Earthly desktop packaging
# stays on the `earthly` runner.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the desktop packaging job be triggered on demand from the Actions tab.
  workflow_dispatch:

# Newer commits on the same ref supersede in-flight runs; this cancels the stale
# run, it does not shortcut the checks within a run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Proto contract: lint and formatting of the single-source-of-truth tree.
  # ----------------------------------------------------------------------------
  proto:
    name: Proto
    runs-on: [self-hosted, Linux, non-earthly]
    steps:
      - uses: actions/checkout@v7

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: buf lint
        if: ${{ !cancelled() }}
        run: buf lint
        working-directory: proto

      - name: buf format check
        if: ${{ !cancelled() }}
        run: buf format --diff --exit-code
        working-directory: proto

  # ----------------------------------------------------------------------------
  # Rust backend: formatting, lints, build (runs build.rs codegen), and tests.
  # ----------------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: [self-hosted, Linux, non-earthly]
    defaults:
      run:
        working-directory: backend
    steps:
      # clean: false preserves backend/target across runs on the self-hosted
      # runner, so incremental cargo builds stay warm without a cache action.
      - uses: actions/checkout@v7
        with:
          clean: false

      # build.rs shells out to protoc to generate the Rust types from ../proto.
      # Install only if the runner does not already have it (Fedora uses dnf).
      - name: Ensure protoc
        run: command -v protoc || sudo dnf install -y protobuf-compiler

      # Pinned to the same Rust the backend image uses (rust:1.96), so CI and
      # the container never drift.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check

      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo build
        if: ${{ !cancelled() }}
        run: cargo build --locked

      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --locked

  # ----------------------------------------------------------------------------
  # TypeScript frontend. Modeled on the Jalapeno Labs house pattern (see the
  # Yearloom CI): every check runs even after an earlier one fails
  # (continue-on-error), and a final status report decides the job's pass/fail
  # so a single red check never masks the others.
  #
  # Node and Yarn are pinned to exact versions (never a floating "latest") so CI
  # matches local development bit for bit.
  # ----------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: [self-hosted, Linux, non-earthly]
    defaults:
      run:
        working-directory: frontend
    steps:
      # clean: false preserves node_modules and .yarn/cache across runs, so
      # `yarn install --immutable` stays warm without a cache action.
      - uses: actions/checkout@v7
        with:
          clean: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0

      # Pin Yarn to the exact version in packageManager; do not rely on whatever
      # Corepack would otherwise resolve.
      - name: Enable Corepack and pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.0 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        id: lint
        continue-on-error: true
        run: yarn lint

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: yarn typecheck

      # Regenerate from the proto tree and fail if the committed output drifted.
      - name: Generated proto in sync
        id: proto-sync
        continue-on-error: true
        run: |
          yarn generate:proto
          git diff --exit-code -- src/proto/generated

      - name: Build
        id: build
        continue-on-error: true
        run: yarn build

      # Production-dependency advisory scan; gates on shipped code at high+.
      - name: Dependency audit
        id: audit
        continue-on-error: true
        run: yarn npm audit --environment production --severity high

      - name: Status report
        if: ${{ always() }}
        run: |
          fail=0
          report() {
            if [ "$1" = "success" ]; then
              printf '  %-24s \033[32m✓ PASS\033[0m\n' "$2"
            else
              printf '  %-24s \033[31m✗ FAIL\033[0m\n' "$2"; fail=1
            fi
          }
          echo "==================== FRONTEND STATUS ===================="
          report "${{ steps.lint.outcome }}"       "Lint"
          report "${{ steps.typecheck.outcome }}"  "Typecheck"
          report "${{ steps.proto-sync.outcome }}" "Generated proto in sync"
          report "${{ steps.build.outcome }}"      "Build"
          report "${{ steps.audit.outcome }}"      "Dependency audit"
          echo "========================================================"
          [ "$fail" = "0" ] || { echo "One or more frontend checks failed."; exit 1; }

  # ----------------------------------------------------------------------------
  # Integration smoke test: bring the real stack up and exercise the proto
  # endpoints end to end. This is the check that catches Dockerfile and runtime
  # regressions (e.g. a missing build.rs) that a plain `cargo build` cannot.
  # ----------------------------------------------------------------------------
  integration:
    name: Integration
    runs-on: [self-hosted, Linux, non-earthly]
    steps:
      - uses: actions/checkout@v7

      - name: Prepare environment
        run: cp .env.example .env

      - name: Start the stack
        run: |
          # Clear any containers/volumes a crashed prior run left behind on the
          # shared runner before bringing the stack up.
          docker compose down -v --remove-orphans || true
          docker compose up --build -d

      - name: Wait for the backend and probe proto endpoints
        run: |
          ready=0
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:31416/health || echo 000)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "backend did not become healthy"
            docker compose logs backend --tail 50
            exit 1
          fi
          # Root is a plain-text liveness ping.
          pong=$(curl -s http://localhost:31416/)
          echo "root body: $pong"
          [ "$pong" = "pong" ] || { echo "expected 'pong'"; exit 1; }
          # /health is plain JSON for monitors, not protobuf.
          health_type=$(curl -s -D - -o /dev/null http://localhost:31416/health \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}')
          echo "health content-type: $health_type"
          case "$health_type" in
            application/json*) ;;
            *) echo "expected application/json"; exit 1 ;;
          esac
          # The versioned API must answer as binary protobuf.
          hello_type=$(curl -s -D - -o /dev/null http://localhost:31416/api/v1/hello \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}')
          echo "hello content-type: $hello_type"
          case "$hello_type" in
            application/x-protobuf*) ;;
            *) echo "expected application/x-protobuf"; exit 1 ;;
          esac
          # db/health hits real Postgres and must report reachable (HTTP 200).
          db_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:31416/api/v1/db/health || echo 000)
          echo "db/health status: $db_code"
          [ "$db_code" = "200" ] || { docker compose logs --tail 50; exit 1; }

      - name: Verify Keycloak realm import
        if: ${{ !cancelled() }}
        run: |
          # The elysium realm must import and serve OIDC discovery.
          ready=0
          for _ in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8080/realms/elysium/.well-known/openid-configuration || echo 000)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 3
          done
          if [ "$ready" != "1" ]; then
            echo "elysium realm did not become available"
            docker compose logs keycloak --tail 50
            exit 1
          fi
          echo "elysium realm OIDC discovery is live"

      - name: Tear down
        if: ${{ always() }}
        run: docker compose down -v --remove-orphans

  # ----------------------------------------------------------------------------
  # Migrations: apply every SQL migration to a throwaway Postgres, on a fresh
  # database, in order, and fail loudly on any error. This catches broken SQL and
  # migrations that only conflict at apply time (e.g. two PRs that both add a
  # migration with the same version prefix, or a table created twice) before they
  # reach a real database.
  #
  # The throwaway Postgres publishes a RANDOM host port (`-p 127.0.0.1:0:5432`) so
  # it never collides with anything else on the shared self-hosted runner; the
  # migrations are applied by psql inside the container, so the runner needs no
  # Postgres client.
  # ----------------------------------------------------------------------------
  migrations:
    name: Migrations
    runs-on: [self-hosted, Linux, non-earthly]
    steps:
      - uses: actions/checkout@v7

      - name: Migration version prefixes are unique
        run: |
          dupes=$(ls backend/migrations/*.sql \
            | xargs -n1 basename \
            | sed -E 's/^([0-9]+)_.*/\1/' \
            | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration version prefix(es): $dupes"
            echo "Two migrations share a numeric prefix; renumber one of them."
            exit 1
          fi
          echo "migration version prefixes are unique"

      - name: Apply all migrations to a throwaway Postgres
        run: |
          set -euo pipefail
          container="elysium-migrate-${{ github.run_id }}-${{ github.run_attempt }}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker rm -f "$container" >/dev/null 2>&1 || true

          docker run -d --name "$container" -p 127.0.0.1:0:5432 \
            -e POSTGRES_USER=migrator \
            -e POSTGRES_PASSWORD=migrator \
            -e POSTGRES_DB=elysium_migrate_test \
            postgres:17.5-alpine >/dev/null

          echo "waiting for Postgres..."
          for _ in $(seq 1 30); do
            if docker exec "$container" pg_isready -U migrator -d elysium_migrate_test >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          for file in $(ls backend/migrations/*.sql | sort); do
            echo "applying $(basename "$file")"
            docker exec -i "$container" \
              psql -U migrator -d elysium_migrate_test -v ON_ERROR_STOP=1 --single-transaction \
              < "$file"
          done
          echo "all migrations applied cleanly to a fresh database"

  # ----------------------------------------------------------------------------
  # Desktop shell: package the Electron app with Earthly. One matrix job per
  # installer target (deb, rpm, AppImage, Windows) so they run as independent,
  # parallel checks. Only on pull requests and on-demand (workflow_dispatch),
  # not on every push to main, since the packaging build is heavy. Artifacts are
  # built but not uploaded yet.
  #
  # Runs on a self-hosted runner tagged `linux` and `earthly` (Docker available
  # for Earthly's BuildKit); Earthly itself is installed at a pinned version by
  # the workflow rather than relying on whatever is on the runner. Everything
  # else runs inside pinned containers.
  # ----------------------------------------------------------------------------
  desktop:
    name: Desktop (${{ matrix.target }})
    if: ${{ github.event_name != 'push' }}
    runs-on: [self-hosted, linux, earthly]
    # Earthly renders monochrome without this; force color for readable logs.
    env:
      FORCE_COLOR: 1
    strategy:
      # Report every target's result; one failing target must not cancel the
      # others, matching the rest of this workflow.
      fail-fast: false
      matrix:
        target: [deb, rpm, appimage, windows]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      # Pin the Earthly version instead of trusting the runner's build; matches
      # the VERSION 0.8 pragma in the Earthfile.
      - name: Set up Earthly
        uses: earthly/actions-setup@v1
        with:
          version: "0.8.1"

      # Build this matrix leg's installer. Output lands in desktop/release/ on
      # the runner; no upload step yet, per the current roadmap.
      - name: Package ${{ matrix.target }}
        run: earthly +${{ matrix.target }}

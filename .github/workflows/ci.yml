# Copyright © 2026 Jalapeno Labs
#
# Continuous integration for Elysium.
#
# Verifies every push to `main` (and every pull request targeting it). The four
# jobs run in parallel and are deliberately independent, so a failure in one does
# not cancel the others: you get the full picture in a single run rather than a
# fail-fast stop at the first red check. Within a job every check still runs even
# after an earlier one fails (via `if: ${{ !cancelled() }}`, or continue-on-error
# plus a final status report), then the job reports failed if any check failed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the desktop packaging job be triggered on demand from the Actions tab.
  workflow_dispatch:

# Newer commits on the same ref supersede in-flight runs; this cancels the stale
# run, it does not shortcut the checks within a run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Proto contract: lint and formatting of the single-source-of-truth tree.
  # ----------------------------------------------------------------------------
  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: buf lint
        if: ${{ !cancelled() }}
        run: buf lint
        working-directory: proto

      - name: buf format check
        if: ${{ !cancelled() }}
        run: buf format --diff --exit-code
        working-directory: proto

  # ----------------------------------------------------------------------------
  # Rust backend: formatting, lints, build (runs build.rs codegen), and tests.
  # ----------------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # build.rs shells out to protoc to generate the Rust types from ../proto.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      # Pinned to the same Rust the backend image uses (rust:1.96), so CI and
      # the container never drift.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: cargo fmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check

      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo build
        if: ${{ !cancelled() }}
        run: cargo build --locked

      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --locked

  # ----------------------------------------------------------------------------
  # TypeScript frontend. Modeled on the Jalapeno Labs house pattern (see the
  # Yearloom CI): every check runs even after an earlier one fails
  # (continue-on-error), and a final status report decides the job's pass/fail
  # so a single red check never masks the others.
  #
  # Node and Yarn are pinned to exact versions (never a floating "latest") so CI
  # matches local development bit for bit.
  # ----------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0

      # Pin Yarn to the exact version in packageManager; do not rely on whatever
      # Corepack would otherwise resolve.
      - name: Enable Corepack and pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.0 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        id: lint
        continue-on-error: true
        run: yarn lint

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: yarn typecheck

      # Regenerate from the proto tree and fail if the committed output drifted.
      - name: Generated proto in sync
        id: proto-sync
        continue-on-error: true
        run: |
          yarn generate:proto
          git diff --exit-code -- src/proto/generated

      - name: Build
        id: build
        continue-on-error: true
        run: yarn build

      # Production-dependency advisory scan; gates on shipped code at high+.
      - name: Dependency audit
        id: audit
        continue-on-error: true
        run: yarn npm audit --environment production --severity high

      - name: Status report
        if: ${{ always() }}
        run: |
          fail=0
          report() {
            if [ "$1" = "success" ]; then
              printf '  %-24s \033[32m✓ PASS\033[0m\n' "$2"
            else
              printf '  %-24s \033[31m✗ FAIL\033[0m\n' "$2"; fail=1
            fi
          }
          echo "==================== FRONTEND STATUS ===================="
          report "${{ steps.lint.outcome }}"       "Lint"
          report "${{ steps.typecheck.outcome }}"  "Typecheck"
          report "${{ steps.proto-sync.outcome }}" "Generated proto in sync"
          report "${{ steps.build.outcome }}"      "Build"
          report "${{ steps.audit.outcome }}"      "Dependency audit"
          echo "========================================================"
          [ "$fail" = "0" ] || { echo "One or more frontend checks failed."; exit 1; }

  # ----------------------------------------------------------------------------
  # Integration smoke test: bring the real stack up and exercise the proto
  # endpoints end to end. This is the check that catches Dockerfile and runtime
  # regressions (e.g. a missing build.rs) that a plain `cargo build` cannot.
  # ----------------------------------------------------------------------------
  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait for the backend and probe proto endpoints
        run: |
          ready=0
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:31416/health || echo 000)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "backend did not become healthy"
            docker compose logs backend --tail 50
            exit 1
          fi
          # Root is a plain-text liveness ping.
          pong=$(curl -s http://localhost:31416/)
          echo "root body: $pong"
          [ "$pong" = "pong" ] || { echo "expected 'pong'"; exit 1; }
          # /health is plain JSON for monitors, not protobuf.
          health_type=$(curl -s -D - -o /dev/null http://localhost:31416/health \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}')
          echo "health content-type: $health_type"
          case "$health_type" in
            application/json*) ;;
            *) echo "expected application/json"; exit 1 ;;
          esac
          # The versioned API must answer as binary protobuf.
          hello_type=$(curl -s -D - -o /dev/null http://localhost:31416/api/v1/hello \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}')
          echo "hello content-type: $hello_type"
          case "$hello_type" in
            application/x-protobuf*) ;;
            *) echo "expected application/x-protobuf"; exit 1 ;;
          esac
          # db/health hits real Postgres and must report reachable (HTTP 200).
          db_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:31416/api/v1/db/health || echo 000)
          echo "db/health status: $db_code"
          [ "$db_code" = "200" ] || { docker compose logs --tail 50; exit 1; }

      - name: Verify Keycloak realm import
        if: ${{ !cancelled() }}
        run: |
          # The elysium realm must import and serve OIDC discovery.
          ready=0
          for _ in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8080/realms/elysium/.well-known/openid-configuration || echo 000)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 3
          done
          if [ "$ready" != "1" ]; then
            echo "elysium realm did not become available"
            docker compose logs keycloak --tail 50
            exit 1
          fi
          echo "elysium realm OIDC discovery is live"

      - name: Tear down
        if: ${{ always() }}
        run: docker compose down -v

  # ----------------------------------------------------------------------------
  # Desktop shell: package the Electron app (deb, rpm, AppImage, Windows) with
  # Earthly. Runs in parallel with the other checks, but only on pull requests
  # and on-demand (workflow_dispatch), not on every push to main, since the
  # packaging build is heavy. Artifacts are built but not uploaded yet.
  #
  # Requires a self-hosted runner tagged `linux` and `earthly` (Earthly and its
  # BuildKit daemon preinstalled); everything else runs inside pinned containers.
  # ----------------------------------------------------------------------------
  desktop:
    name: Desktop
    if: ${{ github.event_name != 'push' }}
    runs-on: [self-hosted, linux, earthly]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Earthly version
        run: earthly --version

      # Build every installer target. Earthly runs the independent targets in
      # parallel and outputs them to desktop/release/ on the runner. No upload
      # step yet, per the current roadmap.
      - name: Package desktop installers
        run: earthly +release

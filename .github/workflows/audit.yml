#
# Weekly dependency vulnerability audit.
#
# Separate from CI on purpose: new CVEs appear on their own schedule and should
# not fail unrelated pull requests. CI keeps its narrow production-dependency
# gate; this sweep covers the full dependency trees (dev included) for both the
# frontend and the backend. Runs every Monday morning and on demand.

name: Audit

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  CARGO_TERM_COLOR: always

jobs:
  frontend-audit:
    name: Frontend audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0

      - name: Enable Corepack and pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.0 --activate

      - name: Audit npm dependencies
        run: yarn npm audit --all --recursive

  backend-audit:
    name: Backend audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit cargo dependencies
        run: cargo audit

# Prepares a Rust crate for checking. The crate's rust-toolchain.toml is the only
# place the compiler version is written; rustup installs exactly that version the
# first time cargo runs inside the crate, and this action never names one itself.
name: Rust toolchain
description: Install the crate's pinned toolchain and restore its compiled dependencies.

inputs:
  crate:
    description: The crate's directory at the repository root, such as api or oauth-broker.
    required: true
  cache:
    description: >-
      The dependency cache the job restores and saves, shared by every job that compiles the
      crate the same way, such as api-test for `cargo test`. Empty for a job that compiles nothing.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The official rust images are minimal and the crates build inside them, so
    # rustfmt and clippy are added here rather than listed in rust-toolchain.toml,
    # where every image build would download them for nothing.
    - name: Install the pinned toolchain
      shell: bash
      working-directory: ${{ inputs.crate }}
      run: |
        set -euo pipefail
        cargo --version
        rustup component add rustfmt clippy
        rustup show active-toolchain
        rustc --version

    # A GitHub-hosted runner starts every job on a fresh machine, so the crate's dependencies
    # come from the Actions cache instead. Only dependencies are kept: the crate itself changes
    # with every commit. It is keyed by the installed toolchains, the lockfiles, and the Cargo
    # and Rust environment variables, so it runs after the toolchain is installed. A job whose
    # tests fail still saves it: its dependencies compiled all the same.
    - name: Restore the compiled dependencies
      if: runner.environment == 'github-hosted' && inputs.cache != ''
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: ${{ inputs.crate }}
        shared-key: ${{ inputs.cache }}
        cache-on-failure: 'true'

    # A self-hosted runner is persistent instead, but actions/checkout runs `git clean -ffdx`,
    # which deletes a target directory inside the checkout at the start of every job. One
    # beside the checkout survives, so the runner compiles only what changed since its last
    # run. It is per crate, and each runner has its own workspace, so no two jobs ever share
    # one at the same time. Deleting it is always safe; the next run rebuilds it.
    - name: Use a persistent target directory
      if: runner.environment == 'self-hosted'
      shell: bash
      env:
        CRATE: ${{ inputs.crate }}
      run: echo "CARGO_TARGET_DIR=${RUNNER_WORKSPACE}/cargo-target/${CRATE}" >> "${GITHUB_ENV}"

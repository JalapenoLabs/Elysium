# Builds one image and pushes it to Docker Hub under the tags the triggering ref earns.
# Used by .github/workflows/publish.yml only; see docs/ci.md.
#
# The runners are persistent and can share one Docker daemon, so nothing here leaves
# state behind: the login lives in a configuration directory inside the job's own
# temporary directory and is removed at the end, and every local tag is removed too.
name: Docker publish
description: Build an image and push it to Docker Hub with the tags for this ref.

inputs:
  repository:
    description: The Docker Hub repository, such as jalapenolabs/example-api.
    required: true
  context:
    description: The build context, relative to the repository root.
    required: true
  dockerfile:
    description: The Dockerfile, relative to the repository root.
    required: true
  username:
    description: The Docker Hub account the token belongs to.
    required: true
  token:
    description: A Docker Hub access token that may push to the repository.
    required: true

runs:
  using: composite
  steps:
    # main publishes `main` and `sha-<commit>`, so any build that landed can be pulled
    # by commit. A release tag vX.Y.Z publishes X.Y.Z, X.Y, and latest. A pre-release
    # (vX.Y.Z-rc.1) publishes only its own version and moves no floating tag.
    - name: Choose the tags
      shell: bash
      run: |
        set -euo pipefail
        case "${GITHUB_REF}" in
          refs/heads/main)
            tags="main sha-${GITHUB_SHA::12}"
            version="main"
            ;;
          refs/tags/v*)
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::${GITHUB_REF_NAME} is not a version tag such as v1.2.3 or v1.2.3-rc.1."
              exit 1
            fi
            tags="${version}"
            if [[ "${version}" != *-* ]]; then
              tags="${tags} ${version%.*} latest"
            fi
            ;;
          *)
            echo "::error::${GITHUB_REF} publishes nothing; only main and version tags do."
            exit 1
            ;;
        esac

        echo "Publishing ${{ inputs.repository }} as: ${tags}"
        {
          echo "PUBLISH_TAGS=${tags}"
          echo "PUBLISH_VERSION=${version}"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker-config"
          # Unique per run, because runners in the pool can share one Docker daemon.
          echo "PUBLISH_BUILD_TAG=${{ inputs.repository }}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        } >> "${GITHUB_ENV}"

    # Fails before the build when the organization's credentials are not shared with
    # this repository, rather than after twenty minutes of compiling.
    - name: Log in to Docker Hub
      shell: bash
      env:
        DOCKERHUB_USERNAME: ${{ inputs.username }}
        DOCKERHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
          echo "::error::The DOCKERHUB_USERNAME variable or DOCKERHUB_TOKEN secret is not available to this repository."
          exit 1
        fi
        mkdir -p "${DOCKER_CONFIG}"
        printf '%s' "${DOCKERHUB_TOKEN}" | docker login --username "${DOCKERHUB_USERNAME}" --password-stdin

    # --pull refreshes the base images, so a published image carries the latest
    # security fixes of its pinned base tags.
    - name: Build the image
      shell: bash
      env:
        CONTEXT: ${{ inputs.context }}
        DOCKERFILE: ${{ inputs.dockerfile }}
      run: |
        set -euo pipefail
        docker build \
          --pull \
          --file "${DOCKERFILE}" \
          --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
          --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
          --label "org.opencontainers.image.version=${PUBLISH_VERSION}" \
          --label "org.opencontainers.image.licenses=Apache-2.0" \
          --tag "${PUBLISH_BUILD_TAG}" \
          "${CONTEXT}"

    # Each tag is pushed from the run's own build tag. Runs of one ref never overlap
    # (the workflow's concurrency group queues them), and main and release tags publish
    # disjoint tag sets, so no other run can retag the image between tag and push.
    - name: Push the tags
      shell: bash
      run: |
        set -euo pipefail
        for tag in ${PUBLISH_TAGS}; do
          docker tag "${PUBLISH_BUILD_TAG}" "${{ inputs.repository }}:${tag}"
          docker push "${{ inputs.repository }}:${tag}"
          docker rmi "${{ inputs.repository }}:${tag}" > /dev/null
        done

    - name: Log out and remove the local build
      if: always()
      shell: bash
      run: |
        if [ -n "${DOCKER_CONFIG:-}" ]; then
          docker logout > /dev/null 2>&1 || true
          rm -rf "${DOCKER_CONFIG}"
        fi
        if [ -n "${PUBLISH_BUILD_TAG:-}" ]; then
          docker rmi --force "${PUBLISH_BUILD_TAG}" > /dev/null 2>&1 || true
        fi

# Production built from this checkout, for a deployment that runs main instead of a published
# release. Layer it over compose.yml, most simply by naming both in .env:
#
#   COMPOSE_FILE=compose.yml:compose.build.yml
#
# then deploy the checkout's main with:
#
#   git pull --ff-only && docker compose up --detach --build --wait
#
# Images get local tags, so a build never shadows the published ones. Leave the `auto-update`
# profile off: the updater installs published releases and would replace this build. See
# docs/infrastructure.md.

# The `app` stage: the API with the web app's production build and the deployment's
# configuration, the same image a release publishes.
x-api-build: &api-build
  context: .
  dockerfile: api/Dockerfile
  target: app
  # Never pushed; without its time-stamped attestation, an unchanged build is the same image.
  provenance: false

services:
  # It builds the image the API and the engine run too, since every path to either starts it
  # first: one service builds each image, as the top of compose.yml explains.
  migrate:
    image: elysium-api:local
    build: *api-build

  api:
    image: elysium-api:local
    # Built by migrate; there is nothing to pull.
    pull_policy: never
    environment:
      WORKSPACE_IMAGE: elysium-workspace:local
      WHISPER_IMAGE: elysium-whisper:local

  engine:
    image: elysium-api:local
    # Built by migrate; there is nothing to pull.
    pull_policy: never
    environment:
      WORKSPACE_IMAGE: elysium-workspace:local
      WHISPER_IMAGE: elysium-whisper:local
    depends_on:
      workspace-image:
        condition: service_completed_successfully
      whisper-image:
        condition: service_completed_successfully

  # The embedding model, built from this checkout with its model. The model is about 550 MB,
  # downloaded once and kept in the build cache by its checksum.
  embeddings:
    image: elysium-embeddings:local
    build:
      context: ./embeddings
      provenance: false

  # Builds the agent workspace's image from this checkout and exits. The engine creates and
  # runs the workspace container itself, from this tag.
  workspace-image:
    image: elysium-workspace:local
    build:
      context: ./workspace
      provenance: false
    entrypoint: [ "true" ]
    restart: "no"

  # Builds Whisper's image, with its model, from this checkout and exits. The engine creates a
  # container of it for each transcription, from this tag. The model is about 3 GB, downloaded
  # once and kept in the build cache by its checksum.
  whisper-image:
    image: elysium-whisper:local
    build:
      context: ./whisper
      provenance: false
    entrypoint: [ "true" ]
    restart: "no"

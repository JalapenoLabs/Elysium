name: elysia

# ---------------------------------------------------------------------------
# Elysia base template
#
#   database           -> Postgres (pinned), the app's persistent state
#   backend            -> Rust / Axum API on port 31416, hot-reloaded
#   frontend           -> Vite + React SPA on port 5173, hot-reloaded
#   keycloak-database  -> Postgres dedicated to Keycloak, isolated from the app
#   keycloak           -> identity provider on port 8080, realm imported on boot
#
# Everything is driven by `.env` (see `.env.example`).
# ---------------------------------------------------------------------------

services:
  database:
    container_name: elysia-database
    # Pinned to a specific patch release rather than `latest` for reproducibility.
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - elysia-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: elysia-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      API_PORT: 31416
      RUST_LOG: ${RUST_LOG:-info}
      # Issuer the API trusts (the browser-facing realm URL, so it matches the
      # tokens clients present). JWKS is fetched over the internal network, which
      # is why the fetch URL and the issuer differ.
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/elysium}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/elysium/protocol/openid-connect/certs}
      # BFF (Backend-for-Frontend): the API is a confidential OIDC client and owns
      # the whole Keycloak conversation; the browser only ever holds a cookie.
      KEYCLOAK_INTERNAL_ISSUER: ${KEYCLOAK_INTERNAL_ISSUER:-http://keycloak:8080/realms/elysium}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-elysium-api}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-dev-elysium-api-secret-change-in-prod}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:31416/auth/callback}
      APP_POST_LOGIN_URL: ${APP_POST_LOGIN_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    ports:
      - "${API_PORT:-31416}:31416"
    volumes:
      # Mount only the sources needed for hot reload; never the host's target dir.
      - ./backend/src:/app/src
      - ./backend/Cargo.toml:/app/Cargo.toml
      - ./backend/Cargo.lock:/app/Cargo.lock
      # build.rs drives protobuf codegen; keep the host copy authoritative.
      - ./backend/build.rs:/app/build.rs
      # Migrations are embedded at compile time by sqlx::migrate!, so the dev
      # container (which compiles at runtime) needs them present.
      - ./backend/migrations:/app/migrations
      # The shared proto tree lives at repo root; build.rs reads it as ../proto,
      # which resolves to /proto from the /app workdir. Read-only: the backend
      # only consumes the contract, never edits it.
      - ./proto:/proto:ro
      # Named volumes keep compiled artifacts and the crate registry warm across
      # restarts, so incremental rebuilds stay fast.
      - elysia-cargo-target:/app/target
      - elysia-cargo-registry:/usr/local/cargo/registry
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:31416/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Generous window: the very first compile inside the container is slow.
      start_period: 300s

  frontend:
    container_name: elysia-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:31416}
      # OIDC endpoints the browser uses for the Keycloak login redirect (Phase D).
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8080}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-elysium}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-elysium-frontend}
      # Windows/Docker bind mounts don't emit inotify events reliably, so Vite
      # falls back to polling for file changes (wired up in vite.config.ts).
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      # Mount the whole project for hot reload, but keep the container's own
      # node_modules by shadowing the host folder with an anonymous volume.
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  keycloak-database:
    container_name: elysia-keycloak-database
    # Same pinned Postgres as the app, but a separate instance and volume so
    # Keycloak's store never mingles with application data.
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
    volumes:
      - elysia-keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    container_name: elysia-keycloak
    # Pinned to a specific release for reproducibility.
    image: quay.io/keycloak/keycloak:26.3.2
    restart: unless-stopped
    # Dev mode: HTTP enabled and hostname checks relaxed. Production runs `start`
    # behind the operator's own TLS/hostname, which is their responsibility per
    # the project vision. `--import-realm` loads the elysium realm on first boot.
    command: ["start-dev", "--import-realm"]
    environment:
      # Bootstrap superuser for the master realm (admin console only, not an app
      # user). Created once on an empty database.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Persistent store: the dedicated Postgres above.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-database:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Expose /health/ready and /metrics on the management port (9000).
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # Pin the base URL so every token declares the same issuer regardless of
      # whether it was requested from the browser or another container. The
      # backend fetches JWKS internally but trusts this issuer string.
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME_URL:-http://localhost:8080}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      # Imported on startup: the elysium realm, its clients, and the passwordless
      # + passkey + TOTP authentication policy.
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    # No container healthcheck: the image ships without a shell or curl, so a
    # clean check is not possible. Readiness is polled via the host instead.
    depends_on:
      keycloak-database:
        condition: service_healthy

volumes:
  elysia-postgres-data:
  elysia-cargo-target:
  elysia-cargo-registry:
  elysia-keycloak-data:

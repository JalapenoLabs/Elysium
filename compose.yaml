# The development datastore. Values come from `.env`, which `yarn dev` creates
# from `.env.example` on first run. Nothing here is a production credential.

services:
  postgres:
    container_name: arsox-postgres
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Off the default port so a host Postgres never collides.
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:

name: elysium

# The production stack, running the published image. compose.dev.yml layers the
# development stack over it: the API built from source and the Vite dev server. See
# docs/infrastructure.md.
#
# Infrastructure credentials, the log filter, and the encryption key come from the
# environment file. Application secrets are not configured here at all: they are
# stored encrypted in Postgres. Everything else is inline below.
#
# The services configured by files beside this one (kratos/, hydra/, nginx/, updater/) run
# images built from those directories, never bind mounts of them. Compose recreates a
# container when its definition or its image changes, and a mounted file changes neither,
# so a deploy would leave the old container running on the old configuration. Top-level
# `configs:` are no better: outside a swarm they are bind mounts too, and their content is
# not part of what Compose compares. A built image is, so:
#
# - `pull_policy: build` rebuilds each image on every `up`, `--build` or not, from cache
#   when nothing changed. A changed file is a new image, and the containers on the old one
#   are recreated; an unchanged one is the same image, and nothing restarts.
# - One service builds each image, and any other runs it by tag: Compose labels an image
#   with the service that built it, so two builders would make two different images of
#   the same files, and every `up` would recreate both.
# - Provenance is off: its attestation is stamped with the build's time, which would make
#   every build a new image. These images are never pushed anywhere.
#
# A release carries these directories (see the API image), so a deployment that runs
# published images builds them from the configuration its updater installed.

# The API and the web app it serves, published from this repository; the engine runs from
# the same image. ELYSIUM_VERSION pins a release such as 1.4.2; unset, the newest release runs.
x-api-image: &api-image jalapenolabs/elysium-api:${ELYSIUM_VERSION:-latest}

# nginx's fixed address on the mail network. Stalwart trusts the PROXY protocol header, which
# carries each mail client's real address, from this address alone. Change it together with the
# mail network's subnet below if that subnet collides with one on the host.
x-mail-ingress-address: &mail-ingress-address 172.29.53.2

x-database-url: &database-url postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}

# The origin browsers reach Elysium at. Sessions, passkeys, and recovery links are bound to
# it, so it must be https, or http://localhost for development. See docs/auth.md.
x-public-url: &public-url ${ELYSIUM_PUBLIC_URL:-http://localhost:${WEB_PORT:-4000}}

# What the API and the engine both read: they are one crate, and each builds the services it
# needs from the same configuration. See docs/engine.md.
x-server-environment: &server-environment
  DATABASE_URL: *database-url
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  ELYSIUM_ENCRYPTION_KEY: ${ELYSIUM_ENCRYPTION_KEY:?ELYSIUM_ENCRYPTION_KEY is not set}
  ELYSIUM_PUBLIC_URL: *public-url
  # Kratos, on the compose network: the public API for sessions, the admin API for
  # managing identities. Browsers never reach the admin API.
  KRATOS_PUBLIC_URL: http://kratos:4433
  KRATOS_ADMIN_URL: http://kratos:4434
  # Hydra's admin API: sign-in and consent for MCP clients, and token introspection.
  HYDRA_ADMIN_URL: http://hydra:4445
  # Hydra's public API, where the API relays MCP clients' own registrations. Never the admin
  # API, which takes fields a client registering itself must not set. See docs/mcp.md.
  HYDRA_PUBLIC_URL: http://hydra:4444
  RUST_LOG: ${RUST_LOG:-info,tower_http=info}
  LOG_FORMAT: compact
  # Empty: frontend and API share nginx's origin, so no cross-origin grant is needed.
  CORS_ALLOWED_ORIGINS: ""
  # Where browsers reach the OAuth broker Gmail and Outlook accounts connect through.
  # Empty disables both. OAUTH_BROKER_INTERNAL_URL may name another address for the servers.
  OAUTH_BROKER_URL: ""
  # The filtered Docker API the mail server, the browsers, the agent workspace, and
  # transcriptions are run through.
  DOCKER_URL: http://docker-proxy:2375
  # The image agent turns run in, from the same release. The engine creates the container.
  WORKSPACE_IMAGE: jalapenolabs/elysium-workspace:${ELYSIUM_VERSION:-latest}
  # The image meetings are transcribed in, Whisper with its model built in, from the same
  # release. The engine creates one container of it per transcription, with no network.
  WHISPER_IMAGE: jalapenolabs/elysium-whisper:${ELYSIUM_VERSION:-latest}
  # The embedding model the knowledge base's passages and searches are embedded by, on the
  # `embeddings` network. See docs/knowledge.md, Embeddings.
  EMBEDDINGS_URL: http://embeddings:8080
  MAIL_INGRESS_ADDRESS: *mail-ingress-address
  TZ: UTC

# Ory Kratos with Elysium's configuration built in (kratos/Dockerfile), built by
# kratos-migrate. The entrypoint derives Kratos's secrets and URLs from the two variables
# below, so the environment file holds nothing for Kratos.
x-kratos: &kratos
  image: elysium-kratos:local
  environment:
    # The same server and credentials as Elysium's database; `migrate` creates `kratos`.
    DSN: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/kratos?sslmode=disable
    ELYSIUM_ENCRYPTION_KEY: ${ELYSIUM_ENCRYPTION_KEY:?ELYSIUM_ENCRYPTION_KEY is not set}
    ELYSIUM_PUBLIC_URL: *public-url
    TZ: UTC

# Ory Hydra, the OAuth 2.1 authorization server MCP clients connect through. Set up like Kratos:
# its configuration is built in (hydra/Dockerfile), built by hydra-migrate, and its secrets
# and URLs are derived from the two variables below. See docs/mcp.md.
x-hydra: &hydra
  image: elysium-hydra:local
  environment:
    # The same server and credentials as Elysium's database; `migrate` creates `hydra`.
    DSN: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/hydra?sslmode=disable
    ELYSIUM_ENCRYPTION_KEY: ${ELYSIUM_ENCRYPTION_KEY:?ELYSIUM_ENCRYPTION_KEY is not set}
    ELYSIUM_PUBLIC_URL: *public-url
    TZ: UTC

services:
  # nginx with Elysium's configuration built in (nginx/Dockerfile): its main configuration,
  # the production routing, and the mail and media stream proxies.
  nginx:
    container_name: elysium-nginx
    image: elysium-nginx:local
    build:
      context: ./nginx
      target: production
      provenance: false
    pull_policy: build
    restart: unless-stopped
    environment:
      # The proxy in front of nginx, such as a TLS terminator, whose X-Forwarded-For names the
      # client. Loopback by default, which trusts nobody. See nginx/real-ip.conf.template.
      TRUSTED_PROXY_ADDRESSES: ${TRUSTED_PROXY_ADDRESSES:-127.0.0.1/32}
    ports:
      # Loopback by default. Everyone signed in shares the workspace, which can write
      # credentials and reach the host through Docker, so WEB_BIND_ADDRESS widens it only for
      # a network whose users may all hold accounts. See docs/security.md.
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-4000}:80"
      # Mail, on every interface: SMTP, submission, and IMAP, passed through to Stalwart.
      # Stalwart authenticates these itself. See nginx/mail.conf.
      - "${SMTP_PORT:-25}:25"
      - "${SUBMISSIONS_PORT:-465}:465"
      - "${IMAPS_PORT:-993}:993"
      # Browser media, on every interface: one port per browser, UDP preferred and TCP for
      # networks that block it. Useless without signaling, which only the API's authenticated
      # stream route carries. Host and container ports must match: each browser names its
      # port in its candidates. See nginx/browser.conf and docs/browser.md.
      - "59000-59007:59000-59007/udp"
      - "59000-59007:59000-59007/tcp"
    networks:
      default:
      mail:
        ipv4_address: *mail-ingress-address
    depends_on:
      api:
        condition: service_healthy
      kratos:
        condition: service_healthy
      # Started, not healthy: a stuck Hydra takes down OAuth for MCP clients, never the web app.
      hydra:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/ok"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  # One-shot: applies pending migrations, then exits. The API refuses to start
  # against an unmigrated schema, so it waits for this to finish. It also creates
  # Kratos's database when it is missing.
  migrate:
    container_name: elysium-migrate
    image: *api-image
    command: ["elysium-api", "migrate", "run"]
    restart: "no"
    environment:
      DATABASE_URL: *database-url
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: applies Kratos's own migrations to its database, then exits. It builds the image
  # both Kratos services run, since every path to `kratos` starts it first.
  kratos-migrate:
    <<: *kratos
    container_name: elysium-kratos-migrate
    build:
      context: ./kratos
      provenance: false
    pull_policy: build
    command: ["migrate", "sql", "--read-from-env", "--yes"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Identities, passwords, passkeys, authenticators, sessions, and recovery. Browsers reach its
  # public API through nginx at /api/identity/; its admin API (4434) is for the API alone.
  kratos:
    <<: *kratos
    container_name: elysium-kratos
    # Built by kratos-migrate; there is nothing to pull.
    pull_policy: never
    command: ["serve", "--watch-courier", "--sqa-opt-out"]
    restart: unless-stopped
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4434/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  # One-shot: applies Hydra's own migrations to its database, then exits. It builds the image
  # both Hydra services run, as kratos-migrate does for Kratos.
  hydra-migrate:
    <<: *hydra
    container_name: elysium-hydra-migrate
    build:
      context: ./hydra
      provenance: false
    pull_policy: build
    command: ["migrate", "sql", "up", "--read-from-env", "--yes"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # OAuth for MCP clients. Its public API (4444) is reached through nginx at /oauth2/ and its
  # discovery documents; its admin API (4445) is for the API alone.
  hydra:
    <<: *hydra
    container_name: elysium-hydra
    # Built by hydra-migrate; there is nothing to pull.
    pull_policy: never
    command: ["serve", "all", "--sqa-opt-out"]
    restart: unless-stopped
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4445/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  # Serves clients alone: the web app, its /api, and MCP clients. It runs no background work;
  # what a request starts that outlives it, it records for the engine. See docs/engine.md.
  api:
    # No container_name and no host port: it may scale, and it must only be reachable through
    # nginx. It runs one replica today; docs/engine.md says what still holds it to one.
    image: *api-image
    restart: unless-stopped
    environment: *server-environment
    networks:
      default:
      # Work a request waits for in Docker: files in the workspace, Claude sign-ins, creating
      # the mail server, and resetting or removing a browser.
      docker-control:
      mail:
      # Agents in the workspace reach Elysium's tools here as http://api:8080, never through
      # nginx.
      agents:
        aliases: [ api ]
      # The embedding model, which a search embeds its query with.
      embeddings:
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/ok"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Long enough for the graceful drain to finish before Docker escalates to SIGKILL.
    stop_grace_period: 30s

  # Every loop, schedule, and agent turn: the runner, Elysia, the connectors' readers, the
  # keepers of browsers, the mail server, the password vault, and Claude accounts, update
  # checks, and backups. It serves nothing but its health check. One runs, which is what the
  # container name holds it to: Elysia's intake must hear each event once. See docs/engine.md.
  engine:
    container_name: elysium-engine
    image: *api-image
    command: ["elysium-engine"]
    restart: unless-stopped
    environment: *server-environment
    networks:
      default:
      # The agent workspace, the mail server, the browsers, and the databases' dumps.
      docker-control:
      # The mail server's management API, and the mailboxes it hosts.
      mail:
      # The embedding model, which every passage of the knowledge base is embedded by.
      embeddings:
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    # What the engine keeps between restarts: the Bitwarden CLI's state, so it stays signed in
    # as the same device, and each backup's dumps until they are uploaded. See
    # docs/passwords.md.
    volumes:
      - engine-data:/var/lib/elysium
    # Long enough for turns to be stopped and recorded before Docker escalates to SIGKILL.
    stop_grace_period: 30s

  # The embedding model: nomic-embed-text-v1.5 served by text-embeddings-inference, with the
  # model built in (embeddings/Dockerfile). It embeds the knowledge base's passages for the
  # engine and, with hybrid search, queries for the API; nothing else reaches it. Its only
  # network has no route out, so no text leaves the host. Long-lived rather than a container per job, as
  # Whisper is, because it is called all day, takes about 1.5 GiB, and starts in seconds; the
  # engine waits for nothing from it, and embeds once it answers. See docs/knowledge.md,
  # Embeddings.
  embeddings:
    container_name: elysium-embeddings
    image: jalapenolabs/elysium-embeddings:${ELYSIUM_VERSION:-latest}
    restart: unless-stopped
    networks:
      - embeddings
    # Four CPUs, which is also how many threads ONNX Runtime works on, since it counts the
    # container's CPU quota; a host needs at least four. A quarter of the default weight, so the
    # API, Postgres, and agents' turns win whenever they want the same cores, and a backfill
    # takes what is left. 1.5 GiB was the peak while measuring; 3 GiB leaves room.
    cpus: 4
    cpu_shares: 256
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 256
    # It reads its model and does arithmetic. Its socket between router and model goes in
    # /tmp, which is all it writes.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ ALL ]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      # Warming the model up took 16 seconds on 4 CPUs of a Ryzen 9 7950X.
      start_period: 90s

  postgres:
    container_name: elysium-postgres
    # pgvector's build of Postgres 18, for the knowledge base's embeddings (docs/knowledge.md),
    # pinned by digest. api/scripts/verify-migrations.sh names the same image.
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
    restart: unless-stopped
    # TIMESTAMPTZ is stored as UTC regardless; pinning the server zone keeps
    # psql output and now()-based values in UTC too.
    command: ["postgres", "-c", "timezone=UTC"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      TZ: UTC
    volumes:
      # Postgres 18 images keep the cluster under a version subdirectory of this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # The only way the API and the engine reach Docker: a proxy that answers the container,
  # image, volume, network, and exec endpoints and refuses the rest (build, swarm, secrets,
  # system). They use it to create and run the agent workspace, the mail server, and the
  # browsers, each browser on a network of its own. Container creation is still enough to
  # control the host, which is one more reason nginx stays on loopback.
  docker-proxy:
    container_name: elysium-docker-proxy
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      VOLUMES: 1
      NETWORKS: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_RESTARTS: 1
      # Agent turns, workspace files, and backups' dumps are `docker exec`.
      EXEC: 1
      EVENTS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-control

  # Auto-update, off unless COMPOSE_PROFILES includes auto-update. It asks the API every
  # minute whether to apply a release, and carries the update out: back up the databases,
  # install the release's configuration, bring the stack up, and roll back when it does not
  # come up healthy. It holds the Docker socket itself, since it runs compose; the API never
  # does, and the updater answers nothing: it only calls out. Its script is built in
  # (updater/Dockerfile). See docs/infrastructure.md.
  updater:
    container_name: elysium-updater
    image: elysium-updater:local
    build:
      context: ./updater
      provenance: false
    pull_policy: build
    profiles: ["auto-update"]
    restart: unless-stopped
    environment:
      # The updater's key for the API's /internal/updater routes is derived from it.
      ELYSIUM_ENCRYPTION_KEY: ${ELYSIUM_ENCRYPTION_KEY:?ELYSIUM_ENCRYPTION_KEY is not set}
      TZ: UTC
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The deployment directory: its compose files, .env, configuration, and backups.
      - .:/deployment

  redis:
    container_name: elysium-redis
    image: redis:8.10.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  default:
  # Only the API, the engine, and the Docker proxy. Internal: it has no route out of the host.
  docker-control:
    internal: true
  # nginx, the API, the engine, and the Stalwart container they create, which answers as
  # `stalwart`.
  # A fixed name, because the API attaches Stalwart to it by name; a fixed subnet, because
  # nginx needs a fixed address. `docker compose down` reports it still in use while Stalwart
  # runs, and leaves it for the next `up`.
  mail:
    name: elysium-mail
    ipam:
      config:
        - subnet: 172.29.53.0/24
          # Every other container gets an address from here, so none can take nginx's
          # fixed address before nginx starts.
          ip_range: 172.29.53.128/25

  # The API and the agent workspace the engine creates, which answers as `workspace`. A plain
  # bridge, because agents need the internet; nginx is not on it, so nothing public reaches it.
  # A fixed name, because the engine attaches the workspace to it by name.
  agents:
    name: elysium-agents

  # The embedding service, the engine, and the API alone. Internal, so it has no route out of
  # the host: nothing sent to the model can leave it.
  embeddings:
    internal: true

volumes:
  postgres-data:
  redis-data:
  # The engine's own state, such as the Bitwarden CLI's. See docs/passwords.md.
  engine-data:

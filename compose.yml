name: elysium

# Infrastructure credentials, the log filter, and the encryption key come from the
# environment file. Application secrets are not configured here at all: they are
# stored encrypted in Postgres. Everything else is inline below.

x-api-build: &api-build
  context: .
  dockerfile: api/Dockerfile

# nginx's fixed address on the mail network. Stalwart trusts the PROXY protocol header, which
# carries each mail client's real address, from this address alone. Change it together with the
# mail network's subnet below if that subnet collides with one on the host.
x-mail-ingress-address: &mail-ingress-address 172.29.53.2

x-database-url: &database-url postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}

services:
  nginx:
    container_name: elysium-nginx
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    ports:
      # Loopback only: the API has no authentication yet and can write credentials.
      - "127.0.0.1:${WEB_PORT:-4000}:80"
      # Mail, on every interface: SMTP, submission, and IMAP, passed through to Stalwart.
      # Stalwart authenticates these itself. See nginx/mail.conf.
      - "${SMTP_PORT:-25}:25"
      - "${SUBMISSIONS_PORT:-465}:465"
      - "${IMAPS_PORT:-993}:993"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/mail.conf:/etc/nginx/stream.d/mail.conf:ro
    networks:
      default:
      mail:
        ipv4_address: *mail-ingress-address
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/ok"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    container_name: elysium-frontend
    build: ./frontend
    restart: unless-stopped
    environment:
      # The browser reaches Vite's HMR websocket through nginx's published port.
      VITE_HMR_CLIENT_PORT: ${WEB_PORT:-4000}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts

  # One-shot: applies pending migrations, then exits. The API refuses to start
  # against an unmigrated schema, so it waits for this to finish.
  migrate:
    container_name: elysium-migrate
    image: elysium-api
    build: *api-build
    command: ["elysium-api", "migrate", "run"]
    restart: "no"
    environment:
      DATABASE_URL: *database-url
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy

  api:
    # No container_name and no host port: it scales, and it must only be reachable through nginx.
    image: elysium-api
    build: *api-build
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      ELYSIUM_ENCRYPTION_KEY: ${ELYSIUM_ENCRYPTION_KEY:?ELYSIUM_ENCRYPTION_KEY is not set}
      RUST_LOG: ${RUST_LOG:-info,tower_http=info}
      LOG_FORMAT: compact
      # Empty: frontend and API share nginx's origin, so no cross-origin grant is needed.
      CORS_ALLOWED_ORIGINS: ""
      # Where browsers reach the OAuth broker Gmail and Outlook accounts connect through.
      # Empty disables both. OAUTH_BROKER_INTERNAL_URL may name another address for the API.
      OAUTH_BROKER_URL: ""
      # The filtered Docker API the mail server is created and run through.
      DOCKER_URL: http://docker-proxy:2375
      MAIL_INGRESS_ADDRESS: *mail-ingress-address
      TZ: UTC
    networks:
      - default
      - docker-control
      - mail
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/ok"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Long enough for the graceful drain to finish before Docker escalates to SIGKILL.
    stop_grace_period: 30s

  postgres:
    container_name: elysium-postgres
    image: postgres:18.6-alpine3.23
    restart: unless-stopped
    # TIMESTAMPTZ is stored as UTC regardless; pinning the server zone keeps
    # psql output and now()-based values in UTC too.
    command: ["postgres", "-c", "timezone=UTC"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      TZ: UTC
    volumes:
      # Postgres 18 images keep the cluster under a version subdirectory of this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # The API's only way to Docker: a proxy that answers the container, image, volume, and
  # network endpoints and refuses the rest (exec, build, swarm, secrets, system). The API
  # uses it to create and run the mail server. Container creation is still enough to
  # control the host, which is one more reason nginx stays on loopback.
  docker-proxy:
    container_name: elysium-docker-proxy
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      VOLUMES: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_RESTARTS: 1
      EVENTS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-control

  redis:
    container_name: elysium-redis
    image: redis:8.10.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  default:
  # Only the API and the Docker proxy. Internal: it has no route out of the host.
  docker-control:
    internal: true
  # nginx, the API, and the Stalwart container the API creates, which answers as `stalwart`.
  # A fixed name, because the API attaches Stalwart to it by name; a fixed subnet, because
  # nginx needs a fixed address. `docker compose down` reports it still in use while Stalwart
  # runs, and leaves it for the next `up`.
  mail:
    name: elysium-mail
    ipam:
      config:
        - subnet: 172.29.53.0/24
          # Every other container gets an address from here, so none can take nginx's
          # fixed address before nginx starts.
          ip_range: 172.29.53.128/25

volumes:
  postgres-data:
  redis-data:

; Runs the DevTools forwarder beside Chromium. Neko's supervisord loads every file in
; /etc/neko/supervisord/. See cdp-forward.py and docs/browser.md.

[program:cdp-forward]
command=/usr/bin/python3 /etc/neko/elysium/cdp-forward.py
autorestart=true
priority=900
user=neko
stdout_logfile=/var/log/neko/cdp-forward.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

[package]
name = "elysium-api"
version = "0.1.0"
edition = "2024"
description = "Elysium HTTP API"
license = "Apache-2.0"
repository = "https://github.com/JalapenoLabs/Elysium"
publish = false

[dependencies]
anyhow = "1.0.104"
arsox-sdk = { git = "https://github.com/JalapenoLabs/arsox-satellites", rev = "5c5252f2009804a70b04022f495d21af6a7c46e7" }
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
axum = "0.8.9"
base64 = "0.23.1"
bollard = { version = "0.21.1", default-features = false, features = ["http"] }
bytes = "1.12.1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
deadpool = { version = "0.13.1", default-features = false, features = ["managed", "rt_tokio_1"] }
diesel = { version = "2.3.13", default-features = false, features = ["postgres_backend", "chrono", "serde_json", "uuid"] }
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool", "async-connection-wrapper", "migrations"] }
diesel-derive-enum = { version = "2.1.0", features = ["postgres"] }
diesel_migrations = { version = "2.3.2", default-features = false, features = ["postgres"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
getrandom = "0.4.3"
governor = "0.10.4"
hex = "0.4.3"
hickory-resolver = "0.26.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
instant-xml = "0.7.6"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
mimalloc = "0.1.52"
prost-types = "0.14.4"
redis = { version = "1.7.0", default-features = false, features = ["tokio-comp", "connection-manager"] }
# The TLS stack arsox-sdk already brings in: rustls on ring with webpki roots.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rusty-s3 = { version = "0.10.2", default-features = false, features = ["rustcrypto", "xml"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
serde_with = { version = "3.23.0", default-features = false, features = ["macros"] }
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["catch-panic", "cors", "request-id", "set-header", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v7", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }
webp = { version = "0.3.1", default-features = false }
webpki-roots = "1.0.9"
zeroize = "1.9.0"

[dev-dependencies]
# Decodes the path segments the fake GitHub receives, such as a label with a space in it.
percent-encoding = "2.3.2"
# Encodes the protobuf answers of the fake satellite that tests drive the SDK against.
prost = "0.14.4"

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting"] }

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"

# An application's dependency tree inevitably pins two versions of some transitive crate;
# this lint is only actionable for libraries.
multiple_crate_versions = "allow"

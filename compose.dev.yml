# The development stack, layered over the production one in compose.yml:
#
#   docker compose -f compose.yml -f compose.dev.yml up --build --wait
#
# The API is built from this checkout instead of pulled, and the web app runs on the
# Vite dev server with source bind-mounted, so edits hot-reload. nginx swaps in
# development.conf, which sends every path outside /api to Vite. See
# docs/infrastructure.md.

# The `server` stage: the API without the web app's production build, which nothing
# here would serve. It skips the frontend stage, so a frontend edit never rebuilds it.
x-api-build: &api-build
  context: .
  dockerfile: api/Dockerfile
  target: server
  # Never pushed; without its time-stamped attestation, an unchanged build is the same image.
  provenance: false

services:
  # The development routing, nginx/development.conf, built in as the production routing is.
  nginx:
    image: elysium-nginx:dev
    build:
      target: development
    depends_on:
      frontend:
        condition: service_started

  frontend:
    container_name: elysium-frontend
    build:
      context: ./frontend
      provenance: false
    restart: unless-stopped
    environment:
      # The browser reaches Vite's HMR websocket through nginx's published port.
      VITE_HMR_CLIENT_PORT: ${WEB_PORT:-4000}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts

  # A local tag, so a development build never shadows the published image. It builds the
  # image the API and the engine run too, since every path to either starts it first: one
  # service builds each image, as the top of compose.yml explains.
  migrate:
    image: elysium-api
    build: *api-build

  api:
    image: elysium-api
    # Built by migrate; there is nothing to pull.
    pull_policy: never
    environment:
      WORKSPACE_IMAGE: elysium-workspace:dev
      WHISPER_IMAGE: elysium-whisper:dev

  engine:
    image: elysium-api
    # Built by migrate; there is nothing to pull.
    pull_policy: never
    environment:
      WORKSPACE_IMAGE: elysium-workspace:dev
      WHISPER_IMAGE: elysium-whisper:dev
    depends_on:
      workspace-image:
        condition: service_completed_successfully
      whisper-image:
        condition: service_completed_successfully

  # Builds the agent workspace's image from this checkout and exits. The engine creates and
  # runs the workspace container itself, from this tag.
  workspace-image:
    image: elysium-workspace:dev
    build:
      context: ./workspace
      provenance: false
    entrypoint: [ "true" ]
    restart: "no"

  # Builds Whisper's image, with its model, from this checkout and exits. The engine creates a
  # container of it for each transcription, from this tag. The model is about 3 GB, downloaded
  # once and kept in the build cache by its checksum.
  whisper-image:
    image: elysium-whisper:dev
    build:
      context: ./whisper
      provenance: false
    entrypoint: [ "true" ]
    restart: "no"

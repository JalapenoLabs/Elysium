<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Elysium</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #e6ecff;
        background: radial-gradient(circle at 50% 30%, #16204a 0%, #0b0f1a 60%, #05070f 100%);
        text-align: center;
        padding: 2rem;
      }
      h1 {
        margin: 0;
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      p {
        margin: 0;
        max-width: 32rem;
        line-height: 1.6;
        color: #9fb0dd;
      }
      button {
        appearance: none;
        border: 1px solid #3d5bd6;
        border-radius: 0.6rem;
        background: linear-gradient(180deg, #2b3f9e 0%, #1d2c72 100%);
        color: #ffffff;
        font-size: 1rem;
        padding: 0.7rem 1.8rem;
        cursor: pointer;
        transition: filter 0.15s ease;
      }
      button:hover {
        filter: brightness(1.15);
      }
    </style>
  </head>
  <body>
    <h1>Waiting for the Elysium workspace</h1>
    <p>
      The desktop shell could not reach the Elysium app. Make sure the stack is
      running (<code>docker compose up</code>), then retry.
    </p>
    <button id="retry" type="button">Retry connection</button>
    <script>
      // `window.elysium` is exposed by the preload bridge (see src/preload.ts).
      document.getElementById('retry').addEventListener('click', function onRetry() {
        if (window.elysium && typeof window.elysium.retry === 'function') {
          window.elysium.retry()
        }
      })
    </script>
  </body>
</html>

# Yarn Berry, linking into a real node_modules folder (no Plug'n'Play), matching
# the frontend. Yarn itself is pinned via `packageManager` in package.json and
# activated through Corepack in CI and the Earthfile.
nodeLinker: node-modules

# electron-forge depends (transitively, via @electron/rebuild) on a git fork of
# node-gyp, so it must be allowlisted here. Scripts are enabled so native build
# helpers can run on install.
approvedGitRepositories:
  - "https://github.com/electron/node-gyp.git"
enableScripts: true
